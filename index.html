<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Аркхем">
<meta name="theme-color" content="#0d1311">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Колоди Аркхема</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: архівна картотека — плитки справ-сищиків; справа відкривається як окремий аркуш; карти як мініатюри з корінцем класу */
:root{
  /* Ніч в Аркемі: чорнильно-зелене тло, пергаментні аркуші справ, кольори класів як на картах */
  color-scheme:dark;
  --night:#0d1311; --night2:#16201c; --bg:#0d1311;
  --paper:#e6dcc3; --paper2:#d8ccad; --ink:#231d16; --muted:#6b5f4c; --line:#b9aa86;
  --glow:#9ec7a6; --brass:#b08d4a; --fg:#e4dcc8; --fgm:#a59c88;
  --accent:#2e5b44;
  --gua:#2b6cb0; --see:#c27318; --rog:#1f7a3c; --mys:#5b3cb0; --sur:#b12f38; --neu:#6f6a5e;
  --wil:#3f57a3; --int:#9c5c22; --com:#a1323a; --agi:#2a7445; --wild:#7d6a24;
  --chip:#d3c6a4; --scrim:rgba(4,8,6,.72); --onc:#ffffff;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% -10%, #1f3a2e 0%, transparent 60%), radial-gradient(90% 60% at 100% 110%, #1b2a3a 0%, transparent 55%), var(--night);background-attachment:fixed;color:var(--fg);min-height:100vh;font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);mix-blend-mode:screen}
.wrap{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:400 clamp(2rem,6vw,2.8rem)/1 var(--f-display);margin:0;text-wrap:balance;color:var(--fg);letter-spacing:.02em;text-shadow:0 0 18px rgba(158,199,166,.25)}
h2{font:400 1.5rem/1.1 var(--f-display);margin:0;text-wrap:balance}
h3{font:800 .76rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--fgm);margin:0}
.panel h3,.sheet h3{color:var(--muted)}
.panel,.tile,.sheet,.pair{color:var(--ink)}
p{margin:0}
.lede{color:var(--fgm);max-width:62ch;margin-top:6px}
.note{font-size:.88rem;color:var(--fgm)}
.panel .note,.sheet .note,.tile .note{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top, 0px);background:var(--night);padding-block:10px;z-index:5;border-bottom:1px solid #2c3a33;scrollbar-width:none}
.tab{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.c-guardian{--c:var(--gua)} .c-seeker{--c:var(--see)} .c-rogue{--c:var(--rog)} .c-mystic{--c:var(--mys)} .c-survivor{--c:var(--sur)} .c-neutral{--c:var(--neu)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* investigator tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%),var(--paper);border:0;border-radius:6px;padding:0;text-align:left;display:grid;grid-template-columns:92px 1fr;min-width:0;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.45);color:var(--ink)}
.tile .tx{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:4px solid var(--c)}
.portrait{background:var(--c) center/cover no-repeat;position:relative;min-height:128px;box-shadow:inset -6px 0 10px rgba(0,0,0,.25)}
.portrait.has{background-size:auto 165%;background-position:5% 22%}
.portrait .ini{position:absolute;inset:0;display:grid;place-items:center;font:400 2.2rem var(--f-display);color:rgba(255,255,255,.85)}
.portrait.has .ini{display:none}
.tile:hover{transform:translateY(-1px)}
.tile{transition:transform .15s}
.tile .nm{font:400 1.25rem/1.1 var(--f-display)}
.tile .en{font-size:.82rem;color:var(--muted)}
.tile .ti{font-size:.92rem}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;margin-top:auto}
.tag{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.prog{height:4px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.stars{font-family:var(--f-mono);letter-spacing:1px}

/* deck view */
.deckhead{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.deckhead .portrait{min-height:110px;border-radius:50%;box-shadow:0 0 0 3px var(--c),0 0 0 6px rgba(176,141,74,.5),0 10px 30px rgba(0,0,0,.6)}
.deckhead .portrait.has{background-size:auto 210%;background-position:6% 18%}
.deckhead h2{font-size:clamp(1.6rem,5vw,2.2rem);color:var(--fg)}
.deckhead .note{color:var(--fgm)}
.deckhead .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.back{align-self:flex-start;border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.st{font-family:var(--f-mono);font-size:.82rem;border:1px solid #3a4a41;border-radius:4px;padding:3px 8px;background:var(--night2);color:var(--fg)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),var(--paper);box-shadow:0 6px 22px rgba(0,0,0,.45);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:88px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--c);border-radius:2px 2px 0 0;min-height:2px}
.bar b{font:600 .72rem var(--f-mono);color:var(--ink)}
.bar span{font:500 .72rem var(--f-mono);color:var(--muted)}
.iconsum{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.88rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.reset{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 9px;font-size:.82rem}
.ghead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;margin-top:8px;padding-bottom:3px;border-bottom:2px solid var(--c);color:var(--c)}
.ghead .cnt{margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-weight:500}
.ghead .ru{font-weight:500;color:var(--muted)}
.sublabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 2px}
.row{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;border-bottom:1px dashed var(--line)}
.row input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.rowbtn{border:0;background:transparent;text-align:left;padding:6px 2px;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;min-width:0}
.rowbtn .n{font-family:var(--f-mono)}
.rowbtn .t{min-width:0}
.rowbtn .t b{font-weight:700;display:block}
.rowbtn .t i{font-style:normal;color:var(--muted);font-size:.84rem}
.right{display:flex;gap:6px;align-items:center}
.row:has(input:checked) .t{opacity:.42;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.scan{position:relative;border:0;padding:0;background:transparent;border-radius:9px;overflow:hidden;aspect-ratio:63/88;max-width:100%;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan .qty{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font:600 .8rem var(--f-mono);border-radius:4px;padding:1px 7px}
.scan.got{opacity:.4}
.scan.land{aspect-ratio:88/63}
.bigscan{width:100%;border-radius:12px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.6)}

/* mini card */
.mc{position:relative;border:0;padding:0;background:var(--paper);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);min-width:0}
.mc .band{background:var(--c);color:var(--onc);padding:8px 8px 10px 44px;min-height:54px;position:relative;display:flex;flex-direction:column;justify-content:center}
.mc .band b{font-weight:800;font-size:.95rem;line-height:1.1;color:#fff}
.mc .band i{font-style:normal;font-size:.74rem;opacity:.85;color:#fff}
.mc .costb{position:absolute;left:7px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:600 .95rem var(--f-mono);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.mc .lvl{position:absolute;left:7px;top:41px;width:30px;text-align:center;font-size:.6rem;letter-spacing:1px;color:#fff}
.mc .bodyc{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.mc .type{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mc .tr{font-size:.8rem;font-style:italic;color:var(--muted)}
.mc .qty{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.35);color:#fff;font:600 .78rem var(--f-mono);border-radius:4px;padding:1px 6px}
.mc.got{opacity:.45}
.mc.big .band{min-height:80px;padding-left:58px}
.mc.big .band b{font-size:1.25rem}
.mc.big .costb{width:40px;height:40px;font-size:1.15rem;top:12px}
.mc.big .lvl{top:56px;width:40px;font-size:.75rem}
.icons{display:flex;gap:3px;flex-wrap:wrap}
.ic{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:4px;color:#fff;font:700 .72rem var(--f-body)}
.ic.w{background:#1d4a73} .ic.i{background:#5e2754} .ic.c{background:#7a2a14} .ic.a{background:#0f634a} .ic.x{background:#6e5a24}
.icn{font:600 .8rem var(--f-mono);display:inline-flex;gap:4px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%),var(--paper);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet .close{align-self:flex-end;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:8px 14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}

ol.ups{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.ups li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.xp{font-family:var(--f-mono);background:var(--chip);border-radius:4px;text-align:center;padding:2px 0;font-size:.85rem}
.swap{min-width:0;font-size:.93rem}
.swap button{border:0;background:transparent;padding:0;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.swap .why{color:var(--accent);font-size:.85rem;display:block}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid #3a4a41;border-radius:6px;background:var(--night2);color:var(--fg)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);flex:1 1 200px;min-width:0}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--rog);font-weight:700}.bad{color:var(--sur);font-weight:700}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pair{border:0;border-radius:6px;padding:10px;background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.4);text-align:left;display:flex;flex-direction:column;gap:4px}
.pair b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.pair span{font-size:.86rem;color:var(--muted)}
.pair .faces{display:flex;gap:6px}
.pair .faces .portrait{width:48px;min-height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.pair .faces .portrait.has{background-size:auto 220%;background-position:6% 18%}
.pair .faces .portrait .ini{font-size:1.2rem}
.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.guide li{max-width:65ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* v4 additions */
.tilew{position:relative;min-width:0;display:flex}
.tilew .tile{flex:1}
.star{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--muted);font-size:1.1rem;line-height:1;display:grid;place-items:center;z-index:2}
.star[aria-pressed="true"]{background:var(--brass);color:#fff;border-color:var(--brass)}
.deckhead .star{position:static;background:var(--night2);border-color:#3a4a41;color:var(--fgm)}
.deckhead .star[aria-pressed="true"]{background:var(--brass);color:#fff}
.scanw{position:relative;min-width:0}
.scanw .scan,.scanw .mc{width:100%}
.tick{position:absolute;left:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:transparent;font-weight:800;font-size:1rem;display:grid;place-items:center;z-index:2}
.tick[aria-pressed="true"]{background:var(--rog);color:#fff}
.subbadge{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--brass);color:#fff;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle}
.scanw .subbadge{position:absolute;left:6px;top:6px;margin:0;z-index:2}
.banner{background:var(--night2);border:1px solid #3a4a41;border-radius:6px;padding:10px 12px;color:var(--fg);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.banner button,.linkbtn{border:1px solid #3a4a41;background:transparent;color:var(--glow);border-radius:4px;padding:3px 10px;font-size:.86rem}
.subs{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.subs .from{color:var(--muted);text-decoration:line-through}
.cyclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cyc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:rgba(255,255,255,.25)}
.cyc input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.cyc small{display:block;color:var(--muted);font-size:.8rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;font-weight:700;font-size:.9rem}
.pbtn.primary{background:var(--ink);color:var(--paper)}
.pbtn.danger{border-color:var(--sur);color:var(--sur)}
.pbtn.danger.armed{background:var(--sur);color:#fff}
textarea,.tin{width:100%;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.45);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.camp{border:0;border-radius:6px;padding:12px;background:var(--paper);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.camp b{font:400 1.2rem var(--f-display)}
.camp .faces{display:flex;gap:4px}
.camp .faces .portrait{width:40px;min-height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.camp .faces .portrait.has{background-size:auto 220%;background-position:6% 18%}
.camp .faces .portrait .ini{font-size:1rem}
.invrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;border-top:1px dashed var(--line);padding-top:12px}
.invrow .portrait{min-height:64px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.invrow .portrait.has{background-size:auto 220%;background-position:6% 18%}
.ctr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctr button{border:0;background:rgba(0,0,0,.06);width:34px;height:32px;font-weight:800;font-size:1.05rem}
.ctr span{min-width:44px;text-align:center;font:600 .95rem var(--f-mono)}
.ctrs{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.ctrs label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.uplist{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.uplist label{display:grid;grid-template-columns:22px 48px 1fr;gap:6px;align-items:center}
.uplist input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.xpsum{font:600 .95rem var(--f-mono)}
.xpsum .left{color:var(--rog)}
.langbtn{margin-left:auto;align-self:flex-start;border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;letter-spacing:.06em}
#foot a{color:var(--glow)}
.pbtn.danger{border-color:var(--sur);color:var(--sur)}
.pbtn.danger.armed{background:var(--sur);color:#fff}

/* memo */
.ruterm{display:block;font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.02em;font-style:italic}
.roundbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--night2);border:1px solid #3a4a41;border-radius:8px;padding:10px 12px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 54px);z-index:4}
.roundbar .rlabel{font:800 .76rem var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--fgm)}
.roundbar .rnum{font:400 2rem/1 var(--f-display);color:var(--fg);min-width:1.5ch}
.roundbar .pbtn{border-color:#3a4a41;color:var(--fg)}
.roundbar .pbtn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.roundbar .pbtn.danger{margin-left:auto;border-color:var(--sur);color:#f2a3a8}
.roundbar .pbtn.danger.armed{background:var(--sur);color:#fff}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.phase{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),var(--paper);color:var(--ink);border-radius:6px;border-top:5px solid var(--c);padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 22px rgba(0,0,0,.45);min-width:0}
.phase.skipped{opacity:.55}
.phead{display:flex;align-items:center;gap:10px}
.pnum{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:400 1.25rem var(--f-display);flex:none}
.ptitle{min-width:0}
.ptitle b{font:400 1.3rem/1.1 var(--f-display)}
.pdone{margin-left:auto;font:600 .85rem var(--f-mono);color:var(--muted)}
.mstep{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line);cursor:pointer}
.mstep input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.mstep b{display:block;font-weight:800}
.mstep i{display:block;font-style:normal;font-size:.9rem;color:#4a4134;margin-top:2px}
.mstep:has(input:checked) b{text-decoration:line-through;opacity:.55}
.mstep:has(input:checked) i{opacity:.5}
.sumh{list-style:none;cursor:pointer}
.sumh::-webkit-details-marker{display:none}
.sumh h3::before{content:'▸ ';}
details[open]>.sumh h3::before{content:'▾ ';}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.pips{display:flex;gap:8px}
.pip{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.pip[aria-pressed="true"]{background:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.act{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:rgba(255,255,255,.25);display:flex;flex-direction:column;gap:4px;min-width:0}
.act .ahead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.act .ahead b{font:400 1.12rem var(--f-display)}
.act .ahead .ruterm{display:inline}
.act p{font-size:.9rem}
.badge{margin-left:auto;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:1px 6px}
.badge.warn{background:var(--sur);color:#fff}
.badge.ok2{background:var(--rog);color:#fff}
.aoo{background:rgba(177,47,56,.12);border-left:4px solid var(--sur);padding:8px 10px;border-radius:4px;font-size:.92rem}
ol.test{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.test li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.tn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 .85rem var(--f-mono)}
.kws{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.kw{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--brass);padding:2px 0 2px 8px}
.kw b{font-weight:800}
.kw span:not(.ruterm){font-size:.9rem}
ul.more{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.memo .ic{vertical-align:middle}

/* official icon font (ArkhamDB), loaded from its source; falls back to letters */
@font-face{font-family:'ahicons';src:url('https://rawcdn.githack.com/Kamalisk/arkhamdb/1bcc9e6ffdf2deddb9075d38d09f58bc7ca6e287/src/AppBundle/Resources/public/fonts/arkham-icons.woff') format('woff'),url('https://rawcdn.githack.com/Kamalisk/arkhamdb/1bcc9e6ffdf2deddb9075d38d09f58bc7ca6e287/src/AppBundle/Resources/public/fonts/arkham-icons.ttf') format('truetype'),url('https://raw.githubusercontent.com/Kamalisk/arkhamdb/1bcc9e6ffdf2deddb9075d38d09f58bc7ca6e287/src/AppBundle/Resources/public/fonts/arkham-icons.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/Kamalisk/arkhamdb@1bcc9e6ffdf2deddb9075d38d09f58bc7ca6e287/src/AppBundle/Resources/public/fonts/arkham-icons.woff') format('woff'),url('https://arkhamdb.com/bundles/app/fonts/arkham-icons.woff') format('woff');font-display:swap}
.ic .g,.tok .g{display:none;font-family:'ahicons';font-weight:normal;font-style:normal;line-height:1}
.ahfont .ic .g,.ahfont .tok .g{display:inline}
.ahfont .ic .l,.ahfont .tok .l{display:none}
.ahfont .ic{font-size:.95rem}
.tok{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#2b2620;color:#f1e7cf;font:700 .7rem var(--f-body);vertical-align:middle}
.ahfont .tok{padding:0 4px;font-size:1rem}
.tok-es{background:#1f4d6b}.tok-fail{background:#6b1f24}.tok-act,.tok-fast,.tok-react{background:#3a3a3a}.tok-per{background:#555}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.88rem}
.leg{display:inline-flex;align-items:center;gap:6px}

/* glossary */
.gh{margin-top:10px}
.gh:first-child{margin-top:0}
.gl{display:flex;flex-direction:column}
.gitem{border-top:1px dashed var(--line)}
.ghead{width:100%;border:0;background:transparent;text-align:left;padding:10px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--ink)}
.ghead .gn{font:400 1.15rem var(--f-display)}
.gos{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);margin-left:auto}
.gother i{font-style:normal;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-right:3px}
.gitem.open .ghead{padding-bottom:4px}
.gbody{padding:0 2px 12px;display:flex;flex-direction:column;gap:8px}
.gbody p{max-width:65ch}
.gex{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gcard{border:1px solid var(--line);background:rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.gletter{font:400 1.5rem var(--f-display);color:var(--ink);text-transform:none;letter-spacing:0;border-bottom:1px solid var(--line);padding-bottom:2px}
.panel .seg{border-color:var(--line)}
</style>

/* ---------- rules ---------- */
function legalIdx(inv, c, sel){
  const opts = OPTS[inv] || []; const f=[c.f,c.f2].filter(Boolean); const tr=c.te||[];
  for(let i=0;i<opts.length;i++){ const o=opts[i];
    if(o.not){ if(o.level && !(o.level.min<=c.xp && c.xp<=o.level.max)) continue; if(o.trait && o.trait.some(t=>tr.includes(t))) return -1; continue; }
    if(o.deck_size_select && !o.faction) continue;
    if(o.level && !(o.level.min<=c.xp && c.xp<=o.level.max)) continue;
    let ok = true;
    if(o.faction) ok = ok && f.some(x=>o.faction.includes(x));
    if(o.faction_select) ok = ok && f.includes(sel);
    if(o.trait) ok = ok && o.trait.some(t=>tr.includes(t));
    if(o.type) ok = ok && o.type.includes(c.t);
    if(o.uses) ok = ok && !!c.ch;
    if(o.text) ok = false;
    if(o.tag && !(o.faction||o.trait||o.uses||o.text)) ok = false;
    if(o.option_select) ok = false;
    if(ok) return i;
  }
  return -1;
}
const invAvailable = (d,pool) => qtyIn(d.inv,pool)>0;
const cache = new Map();
function adapt(d, pool){
  const key = d.id+'|'+pool.join(',');
  if(cache.has(key)) return cache.get(key);
  const cnt = {}, byName = {}, lim = {};
  const add = (k,n) => { cnt[k]=(cnt[k]||0)+n; byName[C[k].en]=(byName[C[k].en]||0)+n; const i=legalIdx(d.inv,C[k],SEL[d.id]); if(i>=0 && OPTS[d.inv][i].limit) lim[i]=(lim[i]||0)+n; };
  const miss = [];
  d.list.forEach(([n,k]) => { const have=qtyIn(k,pool), keep=Math.min(n,have); if(keep) add(k,keep); for(let x=keep;x<n;x++) miss.push(k); });
  const subs = [];
  for(const k of miss){
    const o = C[k]; let best=null, bs=-1e9;
    for(const p of POOL){
      const c = C[p]; const q=qtyIn(p,pool); if(!q) continue;
      const max = Math.min(q, c.dl||2);
      if((cnt[p]||0) >= max || (byName[c.en]||0) >= (c.dl||2)) continue;
      const i = legalIdx(d.inv, c, SEL[d.id]); if(i<0) continue;
      const ol = OPTS[d.inv][i]; if(ol.limit && (lim[i]||0) >= ol.limit) continue;
      let sc = (c.t===o.t?6:0) + (c.f===o.f?3:0) + (c.slot&&c.slot===o.slot?2:0);
      sc += (c.te||[]).filter(t=>(o.te||[]).includes(t)).length*2;
      sc += c.ic.reduce((a,v,j)=>a+Math.min(v,o.ic[j]),0);
      const ofn=o.fn||'', cfn=c.fn||''; let shared=0; for(const ch of ofn) if(cfn.includes(ch)) shared++;
      sc += shared*4; if(ofn && !shared) sc -= 4;
      sc -= Math.abs((c.cost??0)-(o.cost??0))*0.6;
      if(cnt[p]) sc += 1.5;
      if(c.f==='neutral' && o.f!=='neutral') sc -= 1;
      if(WEAK.has(c.en) && c.en!==o.en) sc -= 7;
      if(sc>bs){ bs=sc; best=p; }
    }
    if(best){ add(best,1); subs.push({from:k,to:best}); } else subs.push({from:k,to:null});
  }
  const list = miss.length ? Object.entries(cnt).map(([k,n])=>[n,k]) : d.list;
  const subTo = new Set(subs.map(s=>s.to).filter(Boolean));
  const inList = new Set(list.map(([n,k])=>k));
  const ups = d.ups.filter(u => qtyIn(u.inn,pool)>0 && (!u.out || qtyIn(u.out,pool)>0 || inList.has(u.out)));
  const r = {list, subs, subTo, ups, inList};
  cache.set(key, r); return r;
}
const total = l => l.reduce((a,[n])=>a+n,0);
const checks = id => store.get('chk_'+id) || {};
const gotCount = (d,l) => { const ch=checks(d.id); return l.filter(([n,k])=>ch[k]).reduce((a,[n])=>a+n,0); };

function usedInMap(pool){ const m={}; decksIn(pool).forEach(d=>adapt(d,pool).list.forEach(([n,k])=>{(m[k]=m[k]||[]).push([d.id,n]);})); return m; }

const IMGS = k => EN() ? [`https://arkhamdb.com/bundles/cards/${k}.png`,`https://arkhamdb.com/bundles/cards/${k}.jpg`] : [`https://ru.arkhamdb.com/bundles/cards/${k}.png`,`https://arkhamdb.com/bundles/cards/${k}.png`,`https://arkhamdb.com/bundles/cards/${k}.jpg`];

function hydrate(root=document){
  root.querySelectorAll('[data-portrait]:not([data-done])').forEach(el=>{
    el.dataset.done='1'; const urls=IMGS(el.dataset.portrait); let i=0;
    const next=()=>{ if(i>=urls.length) return; const u=urls[i++]; const im=new Image(); im.onload=()=>{el.style.backgroundImage=`url("${u}")`; el.classList.add('has');}; im.onerror=next; im.src=u; };
    next();
  });
}

function mini(k, n, cls=''){

function scan(k, n, cls=''){

}
document.addEventListener('error', e=>{
  const im=e.target; if(!(im instanceof HTMLImageElement) || !im.dataset.k) return;
  const k=im.dataset.k, urls=IMGS(k), i=+im.dataset.i+1;
  if(i<urls.length){ im.dataset.i=i; im.src=urls[i]; return; }
  failed.add(k);
  const b=im.closest('.scan'); const t=document.createElement('div');
  if(b){ t.innerHTML=mini(k,+b.dataset.n,b.dataset.cls); b.replaceWith(t.firstElementChild); }
  else { t.innerHTML=mini(k,0,'big'); im.replaceWith(t.firstElementChild); }
}, true);

function openCard(k){
  const c=C[k], s=document.getElementById('sheet'), pool=activePool(), ui=usedInMap(pool), l=L();
  const uses = (ui[k]||[]).map(([id,n])=>{const d=deckById(id), inv=C[d.inv]; return `<button class="c-${inv.f}" data-go="${id}"><span class="dot"></span>${esc(nm(d.inv))}${D.filter(x=>x.inv===d.inv).length>1?' · '+esc(dTitle(d)):''} ×${n}</button>`;}).join('');
  const inDeck = S.deck && adapt(deckById(S.deck),pool).inList.has(k);
  const got = inDeck && checks(S.deck)[k];
  const boxes = Object.entries(c.bx||{}).map(([b,q])=>`${esc(boxName(b))} ×${q}`).join(', ');
  s.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(nm(k))}">
    <button class="close" data-close="1">${l.close}</button>
    ${failed.has(k)?mini(k,0,'big'):`<img class="bigscan" src="${IMGS(k)[0]}" data-i="0" data-k="${k}" alt="${esc(nm(k))}">`}
    <div style="display:flex;flex-direction:column;gap:2px"><h2>${esc(nm(k))}</h2><span class="note">${esc(nm2(k))}${c.sub?' · '+esc(c.sub):''}${nm2(k)||c.sub?' · ':''}${l.type[c.t]||c.t}${c.tr?' · '+esc(EN()?c.tre:c.tr):''}</span><span class="icons">${c.ic.some(x=>x)?iconsHtml(c):''}</span></div>
    ${inDeck?`<button class="pbtn ${got?'':'primary'}" data-sheettick="${k}">${got?l.unmark:l.markFound}</button>`:''}
    <dl class="kv">
      <dt>${l.kv.cls}</dt><dd>${l.fac[c.f]}${c.f2?' + '+l.fac[c.f2]:''}</dd>
      <dt>${l.kv.lvl}</dt><dd>${l.kv.lv(c.xp)}${c.cost!=null?l.kv.cost(c.cost):''}</dd>
      ${c.hp||c.san?`<dt>${l.kv.hs}</dt><dd>${c.hp??'–'} / ${c.san??'–'}</dd>`:''}
      <dt>${l.kv.box}</dt><dd>${boxes}</dd>
      <dt>${l.kv.own}</dt><dd>${l.kv.pcs(qtyIn(k,pool))}</dd>
    </dl>
    ${uses?`<div style="display:flex;flex-direction:column;gap:6px"><h3>${l.usedIn}</h3><div class="uses">${uses}</div></div>`:''}
    <div class="btns">
      <a class="btn primary" href="https://${l.dbHost}/card/${k}" target="_blank" rel="noopener">${l.openDb}</a>
      <a class="btn" href="https://${l.dbHost2}/card/${k}" target="_blank" rel="noopener">${l.openDbOther}</a>
    </div>
  </div></div>`;
  s.hidden=false; s.querySelector('.close').focus();
}
function closeSheet(){ const s=document.getElementById('sheet'); s.hidden=true; s.innerHTML=''; }
function toggleCheck(deckId, k){ const ch=checks(deckId); ch[k]=!ch[k]; store.set('chk_'+deckId,ch); }

  if(e.target.dataset.close) closeSheet();
});

      round:'Раунд', next:'Следующий раунд →', resetAll:'Начать сценарий заново', skip:'В первом раунде фазу Мифа пропускают.', setupT:'Подготовка сценария', setupNote:'Один раз перед сценарием.', resetSetup:'Сбросить',

 setup:[
  {uk:'Збери мішок хаосу за рівнем складності з книги кампанії.', ru:'Соберите мешок хаоса по уровню сложности из руководства кампании.', en:'Build the chaos bag for your difficulty from the campaign guide.'},
  {uk:'Вибери ведучого сищика — він вирішує спірні моменти.', ru:'Выберите ведущего сыщика — он решает спорные вопросы.', en:'Choose the lead investigator — they settle ties and choices.'},
  {uk:'Кожен сищик бере 5 ресурсів із резерву.', ru:'Каждый сыщик берёт 5 ресурсов из резерва.', en:'Each investigator takes 5 resources from the token pool.'},
  {uk:'Перетасуй колоду (з сигнатурними картами й слабкостями) і візьми 5 карт. Слабкість, що прийшла при підготовці, відклади й візьми іншу карту.', ru:'Перемешайте колоду (с персональными картами и слабостями) и возьмите 5 карт. Слабость, взятую при подготовке, отложите и возьмите другую карту.', en:'Shuffle your deck (with signature cards and weaknesses) and draw 5. A weakness drawn during setup is set aside and replaced.'},
  {uk:'Заміна (раз): відклади будь-які карти зі стартової руки, візьми стільки ж, потім замішай відкладене назад.', ru:'Замена (один раз): отложите любые карты стартовой руки, возьмите столько же, затем замешайте отложенные обратно.', en:'Mulligan (once): set aside any cards from your opening hand, draw that many, then shuffle the set-aside cards back.'},
  {uk:'Підготуй сценарій за книгою: колоди сцен і замислів, локації, колоду контактів. Прочитай вступ.', ru:'Подготовьте сценарий по руководству: колоды сцен и замыслов, локации, колоду контактов. Прочитайте вступление.', en:'Set up the scenario from the guide: act and agenda decks, locations, encounter deck. Read the intro.'},
 ],
 phases:[
  {id:'myth', c:'mys', n:{uk:'Фаза Міфів',ru:'Фаза Мифа',en:'Mythos phase'}, skip1:true, steps:[
    {t:{uk:'Поклади 1 безвихідь на поточний замисел',ru:'Положите 1 безысходность на текущий замысел',en:'Place 1 doom on the current agenda'}, d:{uk:'Жетон безвиході (doom) — таймер сценарію.',ru:'Жетон безысходности — таймер сценария.',en:'Doom is the scenario\'s clock.'}},
    {t:{uk:'Перевір, чи досягнуто потрібної кількості безвиході',ru:'Проверьте, не достигнуто ли требуемое число безысходности',en:'Check the doom threshold'}, d:{uk:'Рахуй УСЮ безвихідь у грі: на замислі, ворогах, картах. Якщо вона ≥ числа на замислі — замисел просувається: прибери безвихідь і прочитай зворот.',ru:'Считайте ВСЮ безысходность в игре: на замысле, врагах, картах. Если она ≥ числа на замысле — замысел продвигается: уберите безысходность и прочитайте оборот.',en:'Count ALL doom in play: agenda, enemies, other cards. If it meets the agenda\'s threshold, the agenda advances: remove the doom and read the back.'}},
    {t:{uk:'Кожен сищик бере 1 карту контакту',ru:'Каждый сыщик берёт 1 карту контакта',en:'Each investigator draws 1 encounter card'}, d:{uk:'По черзі гравців. Ворог виходить за своїм «Выходит» (або у твою локацію й сражається з тобою). Напасть — виконай «Раскрытие». «Наплыв» — візьми ще одну карту.',ru:'В порядке игроков. Враг выходит по указанию «Выходит» (или в вашу локацию и сражается с вами). Напасть — разыграйте «Раскрытие». «Наплыв» — возьмите ещё карту.',en:'In player order. An enemy spawns per its Spawn instruction (or at your location, engaged with you). A treachery: resolve its Revelation. Surge: draw another card.'}},
  ]},
  {id:'inv', c:'see', n:{uk:'Фаза сищиків',ru:'Фаза сыщиков',en:'Investigation phase'}, steps:[
    {t:{uk:'Домовтеся про порядок ходів',ru:'Договоритесь о порядке ходов',en:'Agree on turn order'}, d:{uk:'Порядок можна міняти щораунду. Якщо не домовились — вирішує ведучий сищик.',ru:'Порядок можно менять каждый раунд. Если не договорились — решает ведущий сыщик.',en:'Order can change every round. If you cannot agree, the lead investigator decides.'}},
    {t:{uk:'Кожен сищик робить свій хід: до 3 дій',ru:'Каждый сыщик делает ход: до 3 действий',en:'Each investigator takes a turn: up to 3 actions'}, d:{uk:'Будь-які дії, у будь-якому порядку, можна повторювати. Список дій — нижче. Швидкі (Быстрое) карти й реакції — без дії.',ru:'Любые действия, в любом порядке, можно повторять. Список действий — ниже. Быстрые карты и реакции — без действия.',en:'Any actions, in any order, repeats allowed. See the action list below. Fast cards and reactions cost no action.'}},
    {t:{uk:'Просуньте сцену, якщо є улики',ru:'Продвиньте сцену, если хватает улик',en:'Advance the act if you have the clues'}, d:{uk:'Разом витратьте потрібну кількість улик — це без дії, у хід будь-якого сищика. Зайві улики лишаються у вас.',ru:'Совместно потратьте требуемое число улик — это без действия, в ход любого сыщика. Лишние улики остаются у вас.',en:'Spend the required clues as a group — no action, during any investigator\'s turn. Extra clues stay with you.'}},
    {t:{uk:'Переверни міні-карту після ходу',ru:'Переверните мини-карту после хода',en:'Flip your mini-card when your turn ends'}, d:{uk:'Так видно, хто вже ходив у цьому раунді.',ru:'Так видно, кто уже ходил в этом раунде.',en:'Shows who has already acted this round.'}},
  ]},
  {id:'enemy', c:'sur', n:{uk:'Фаза ворогів',ru:'Фаза врагов',en:'Enemy phase'}, steps:[
    {t:{uk:'Вороги-Мисливці рухаються',ru:'Враги-Охотники перемещаются',en:'Hunter enemies move'}, d:{uk:'Кожен розвернутий Мисливець, який ні з ким не сражається і стоїть без сищиків, рухається на 1 локацію до найближчого сищика («Добыча» вирішує, до кого). Дійшов — починає сражатися.',ru:'Каждый развёрнутый Охотник, который ни с кем не сражается и стоит без сыщиков, перемещается на 1 локацию к ближайшему сыщику («Добыча» решает, к кому). Дошёл — начинает сражаться.',en:'Each ready, unengaged Hunter with no investigator at its location moves 1 location toward the nearest investigator (Prey picks whom). If it reaches one, it engages.'}},
    {t:{uk:'Вороги атакують',ru:'Враги атакуют',en:'Enemies attack'}, d:{uk:'По черзі гравців: кожен розвернутий ворог, що сражається з тобою, завдає свої рани й жах одночасно, а потім повертається (виснажується). Рани/жах можна розподілити на активи зі здоровʼям/розсудком.',ru:'В порядке игроков: каждый развёрнутый враг, сражающийся с вами, наносит раны и ужас одновременно, затем поворачивается. Раны и ужас можно распределить на активы со здоровьем/рассудком.',en:'In player order: each ready enemy engaged with you deals its damage and horror at once, then exhausts. You may assign damage/horror to assets with health/sanity.'}},
  ]},
  {id:'up', c:'gua', n:{uk:'Фаза передишки',ru:'Фаза передышки',en:'Upkeep phase'}, steps:[
    {t:{uk:'Переверни міні-карти назад',ru:'Переверните мини-карты обратно',en:'Flip mini-cards back'}, d:{uk:'Дії знову доступні.',ru:'Действия снова доступны.',en:'Actions reset.'}},
    {t:{uk:'Розверни всі повернуті карти',ru:'Разверните все повёрнутые карты',en:'Ready all exhausted cards'}, d:{uk:'Свої активи і ворогів. Розвернутий ворог у твоїй локації, що ні з ким не сражається, починає сражатися з тобою.',ru:'Свои активы и врагов. Развёрнутый враг в вашей локации, который ни с кем не сражается, начинает сражаться с вами.',en:'Your assets and enemies. A readied unengaged enemy at your location engages you.'}},
    {t:{uk:'Кожен бере 1 карту і 1 ресурс',ru:'Каждый берёт 1 карту и 1 ресурс',en:'Each draws 1 card and gains 1 resource'}, d:{uk:'Колода закінчилась — замішай скид у колоду, візьми карту й отримай 1 жах.',ru:'Колода кончилась — замешайте сброс в колоду, возьмите карту и получите 1 ужас.',en:'Deck empty? Shuffle your discard in, draw, and take 1 horror.'}},
    {t:{uk:'Перевір розмір руки: максимум 8',ru:'Проверьте размер руки: максимум 8',en:'Check hand size: maximum 8'}, d:{uk:'Зайві карти скинь на свій вибір.',ru:'Лишние карты сбросьте на свой выбор.',en:'Discard down to 8, your choice.'}},
  ]},
 ],
 actions:[
  {n:{uk:'Дослідження',ru:'Исследование',en:'Investigate'}, a:1, d:{uk:'Перевірка {I} проти неясності локації. Успіх — знайди 1 улику.',ru:'Проверка {I} против неясности локации. Успех — найдите 1 улику.',en:'{I} test vs the location\'s shroud. Success: discover 1 clue.'}},
  {n:{uk:'Рух',ru:'Движение',en:'Move'}, a:1, d:{uk:'У звʼязану локацію. Закрита локація відкривається — поклади на неї улики. Вороги, що сражаються з тобою, йдуть слідом.',ru:'В связанную локацию. Закрытая локация открывается — положите на неё улики. Враги, сражающиеся с вами, идут следом.',en:'To a connecting location. An unrevealed location is revealed — place its clues. Engaged enemies follow you.'}},
  {n:{uk:'Взяти карту',ru:'Взять карту',en:'Draw'}, a:1, d:{uk:'Візьми 1 карту з колоди.',ru:'Возьмите 1 карту из колоды.',en:'Draw 1 card.'}},
  {n:{uk:'Взяти ресурс',ru:'Взять ресурс',en:'Resource'}, a:1, d:{uk:'Візьми 1 ресурс.',ru:'Возьмите 1 ресурс.',en:'Gain 1 resource.'}},
  {n:{uk:'Зіграти карту',ru:'Сыграть карту',en:'Play'}, a:1, d:{uk:'Заплати ціну й зіграй актив або подію. Швидкі (Быстрое) карти — без дії, у будь-який момент, коли дозволено.',ru:'Заплатите цену и сыграйте актив или событие. Быстрые карты — без действия, в любой разрешённый момент.',en:'Pay the cost to play an asset or event. Fast cards need no action and can be played whenever allowed.'}},
  {n:{uk:'Активація',ru:'Активация',en:'Activate'}, a:1, d:{uk:'Властивість зі значком {act} на карті (актив, локація, ворог, сцена). Скільки значків — стільки дій.',ru:'Свойство со значком {act} на карте (актив, локация, враг, сцена). Сколько значков — столько действий.',en:'An ability with the {act} icon on a card (asset, location, enemy, act). One action per icon.'}},
  {n:{uk:'Почати сражатися',ru:'Начать сражаться',en:'Engage'}, a:1, d:{uk:'Почни сражатися з ворогом у своїй локації (так можна й з «Осторожным»).',ru:'Начните сражаться с врагом в вашей локации (так можно и с «Осторожным»).',en:'Engage an enemy at your location (works on Aloof enemies too).'}},
  {n:{uk:'Бій',ru:'Бой',en:'Fight'}, a:0, d:{uk:'Перевірка {C} проти бою ворога. Успіх — 1 рана (+ бонус зброї). Провал проти ворога, що сражається з іншим сищиком, — рана йде тому сищикові.',ru:'Проверка {C} против боя врага. Успех — 1 рана (+ бонус оружия). Провал против врага, сражающегося с другим сыщиком, — рана достаётся тому сыщику.',en:'{C} test vs the enemy\'s fight. Success: 1 damage (+ weapon bonus). Failing against an enemy engaged with another investigator damages that investigator.'}},
  {n:{uk:'Ухід',ru:'Уход',en:'Evade'}, a:0, d:{uk:'Перевірка {A} проти уходу ворога. Успіх — поверни ворога й більше не сражайся з ним.',ru:'Проверка {A} против ухода врага. Успех — поверните врага и перестаньте с ним сражаться.',en:'{A} test vs the enemy\'s evade. Success: exhaust it and disengage.'}},
  {n:{uk:'Переговори',ru:'Переговоры',en:'Parley'}, a:0, d:{uk:'Тільки властивість карти з позначкою «Переговоры».',ru:'Только свойство карты с пометкой «Переговоры».',en:'Only through a card ability marked Parley.'}},
  {n:{uk:'Втеча',ru:'Побег',en:'Resign'}, a:0, d:{uk:'Властивість «Побег» на локації чи карті: виходиш зі сценарію, не будучи переможеним.',ru:'Свойство «Побег» на локации или карте: вы выходите из сценария, не будучи побеждённым.',en:'A Resign ability on a location or card: you leave the scenario without being defeated.'}},
 ],
 aooNote:{uk:'Якщо з тобою сражається хоча б 1 розвернутий ворог, будь-яка дія, крім Бою, Уходу, Переговорів і Втечі, викликає його внеочередну атаку (ворог після неї не повертається).',ru:'Если с вами сражается хотя бы 1 развёрнутый враг, любое действие, кроме Боя, Ухода, Переговоров и Побега, вызывает его внеочередную атаку (враг после неё не поворачивается).',en:'If at least 1 ready enemy is engaged with you, any action other than Fight, Evade, Parley or Resign provokes its attack of opportunity (it does not exhaust afterwards).'},
 test:[
  {uk:'Визнач навичку й складність.',ru:'Определите навык и сложность.',en:'Determine the skill and difficulty.'},
  {uk:'Додай карти з руки: кожен збіглий символ навички +1 ({W} {I} {C} {A}), дикий ★ підходить до всього. Інші сищики у твоїй локації — по 1 карті.',ru:'Добавьте карты с руки: каждый совпавший символ +1 ({W} {I} {C} {A}), символ ★ подходит ко всему. Другие сыщики в вашей локации — по 1 карте.',en:'Commit cards from hand: each matching icon +1 ({W} {I} {C} {A}), wild ★ matches anything. Other investigators at your location may commit 1 card each.'},
  {uk:'Витягни 1 жетон хаосу.',ru:'Вытяните 1 жетон хаоса.',en:'Reveal 1 chaos token.'},
  {uk:'Застосуй жетон: число — модифікатор. {skull} {cultist} {tablet} {elder} — дивись карту сценарію. {es} — властивість твого сищика. {fail} — автоматичний провал.',ru:'Примените жетон: число — модификатор. {skull} {cultist} {tablet} {elder} — смотрите карту сценария. {es} — свойство вашего сыщика. {fail} — автоматический провал.',en:'Apply the token: a number is a modifier. {skull} {cultist} {tablet} {elder} — see the scenario card. {es} — your investigator\'s ability. {fail} — automatic failure.'},
  {uk:'Порівняй: навичка (не менше 0) ≥ складності — успіх. «Превысили на X» — різниця.',ru:'Сравните: навык (не меньше 0) ≥ сложности — успех. «Превысили на X» — разница.',en:'Compare: skill (minimum 0) ≥ difficulty is a success. “Succeed by X” is the difference.'},
  {uk:'Виконай наслідки, скинь додані карти, поверни жетон у мішок.',ru:'Примените результат, сбросьте добавленные карты, верните жетон в мешок.',en:'Apply the result, discard committed cards, return the token to the bag.'},
 ],

 types:[
  {n:{uk:'Актив',ru:'Актив',en:'Asset'}, d:{uk:'Грається дією «Сыграть карту» і лишається в грі: зброя, предмети, союзники, заклинання. Займає слот. Виклади ключові активи якомога раніше — вони працюють увесь сценарій. Властивість {act} коштує дію, повернута карта розвертається в передишці.',ru:'Играется действием «Сыграть карту» и остаётся в игре: оружие, вещи, союзники, заклинания. Занимает слот. Выкладывайте ключевые активы как можно раньше — они работают весь сценарий. Свойство {act} стоит действие, повёрнутая карта разворачивается в передышке.',en:'Played with the Play action and stays in play: weapons, items, allies, spells. Takes a slot. Get key assets out early — they work all scenario. An {act} ability costs an action; exhausted cards ready in upkeep.'}},
  {n:{uk:'Подія',ru:'Событие',en:'Event'}, d:{uk:'Одноразова: ефект — і в скид. Звичайну граєш дією. Подія з {fast} «Быстрое» — без дії, у момент, вказаний на карті («Играйте, когда…»). Тримай захисні події (скасувати атаку, втекти) на потрібний момент.',ru:'Одноразовое: эффект — и в сброс. Обычное играется действием. Событие {fast} «Быстрое» — без действия, в момент, указанный на карте («Играйте, когда…»). Держите защитные события (отменить атаку, уйти) на нужный момент.',en:'One-shot: resolve and discard. A normal event costs an action. A {fast} Fast event costs none and is played at the moment it names (“Play when…”). Save defensive events for the right moment.'}},
  {n:{uk:'Навичка',ru:'Навык',en:'Skill'}, d:{uk:'Не грається! Тільки додається з руки до перевірки — символи зліва на карті ({W} {I} {C} {A} ★) додають +1 кожен. Після перевірки йде в скид, а її текст спрацьовує (часто лише при успіху).',ru:'Не играется! Только добавляется с руки к проверке — символы слева на карте ({W} {I} {C} {A} ★) дают +1 каждый. После проверки уходит в сброс, а её текст срабатывает (часто только при успехе).',en:'Never played! Only committed from hand to a test — the icons on the left ({W} {I} {C} {A} ★) add +1 each. Discarded after the test; its text resolves (often only on success).'}},
  {n:{uk:'Будь-яка карта як навичка',ru:'Любая карта как навык',en:'Any card as a skill'}, d:{uk:'Актив чи подію теж можна додати до перевірки заради символів зліва — але тоді втрачаєш саму карту.',ru:'Актив или событие тоже можно добавить к проверке ради символов слева — но тогда вы теряете саму карту.',en:'Assets and events can also be committed for their icons — but you lose the card.'}},
  {n:{uk:'Слабкість',ru:'Слабость',en:'Weakness'}, d:{uk:'Коли береш — одразу розігруєш (як напасть або ворог). Не можна скинути, щоб уникнути. Базова слабкість — випадкова, персональна — свого сищика.',ru:'Когда берёте — сразу разыгрываете (как напасть или врага). Нельзя сбросить, чтобы избежать. Базовая слабость — случайная, персональная — своего сыщика.',en:'Resolved as soon as drawn (like a treachery or enemy). You cannot discard it to avoid it. A basic weakness is random; a signature one belongs to your investigator.'}},
 ],
 fight:[
  {uk:'Розвернутий ворог у твоїй локації сам починає сражатися з тобою (крім «Осторожного» — до нього дія «Начать сражаться»).',ru:'Развёрнутый враг в вашей локации сам начинает сражаться с вами (кроме «Осторожного» — к нему действие «Начать сражаться»).',en:'A ready enemy at your location engages you on its own (except Aloof — use the Engage action).'},
  {uk:'У свій хід — дія «Бой» або властивість зброї {act} «Бой». Перевірка {C} проти значення бою ворога. Додай карти з {C}. Ні те, ні інше не викликає внеочередної атаки.',ru:'В свой ход — действие «Бой» или свойство оружия {act} «Бой». Проверка {C} против значения боя врага. Добавьте карты с {C}. Ни то, ни другое не вызывает внеочередной атаки.',en:'On your turn: the Fight action or a weapon\'s {act} Fight ability. Test {C} vs the enemy\'s fight value; commit {C} cards. Neither provokes an attack of opportunity.'},
  {uk:'Успіх — 1 рана, плюс бонус зброї (+1 рана тощо). Рани ≥ здоровʼя ворога — переможений: у скид контактів, або на победный счёт, якщо в нього «Победа X».',ru:'Успех — 1 рана плюс бонус оружия (+1 рана и т. п.). Раны ≥ здоровья врага — побеждён: в сброс контактов, или на победный счёт, если у него «Победа X».',en:'Success: 1 damage plus the weapon bonus. Damage ≥ its health: defeated — to the encounter discard, or the victory display if it has Victory X.'},
  {uk:'Провал — ворог не постраждав (а «Мститель» ще й атакує).',ru:'Провал — враг не пострадал (а «Мститель» ещё и атакует).',en:'Failure: no damage (and a Retaliate enemy attacks you).'},
  {uk:'Не хочеш битися — «Уход»: перевірка {A} проти уходу ворога. Успіх — ворог повернутий, не сражається і не атакує, доки не розвернеться в передишці. Після уходу можна рухатися й досліджувати без внеочередних атак.',ru:'Не хотите сражаться — «Уход»: проверка {A} против ухода врага. Успех — враг повёрнут, не сражается и не атакует, пока не развернётся в передышке. После ухода можно двигаться и исследовать без внеочередных атак.',en:'Rather not fight? Evade: test {A} vs its evade. Success: it is exhausted, disengaged and will not attack until it readies in upkeep. Then you can move and investigate without attacks of opportunity.'},
  {uk:'У фазі ворогів кожен розвернутий ворог, що сражається з тобою, атакує: рани й жах одночасно. Повернутий — не атакує.',ru:'В фазе врагов каждый развёрнутый враг, сражающийся с вами, атакует: раны и ужас одновременно. Повёрнутый — не атакует.',en:'In the enemy phase every ready enemy engaged with you attacks: damage and horror at once. Exhausted enemies do not attack.'},
  {uk:'Напарник може атакувати ворога, що сражається з тобою, але при провалі рана дістанеться тобі.',ru:'Напарник может атаковать врага, сражающегося с вами, но при провале рану получите вы.',en:'A partner may attack an enemy engaged with you, but on a failure you take the damage.'},
 ],
 invest:[
  {uk:'У локації є неясність (складність пошуку) і улики. Число улик з {per} множ на кількість сищиків.',ru:'У локации есть неясность (сложность поиска) и улики. Число улик с {per} умножайте на число сыщиков.',en:'A location has a shroud (search difficulty) and clues. Multiply clue values marked {per} by the number of investigators.'},
  {uk:'Закрита локація відкривається, щойно ти в неї входиш: переверни й поклади улики.',ru:'Закрытая локация открывается, как только вы в неё входите: переверните и положите улики.',en:'An unrevealed location is revealed as soon as you enter it: flip it and place its clues.'},
  {uk:'Дія «Исследование»: перевірка {I} проти неясності. Додай карти з {I}. Успіх — візьми 1 улику з локації собі.',ru:'Действие «Исследование»: проверка {I} против неясности. Добавьте карты с {I}. Успех — возьмите 1 улику с локации себе.',en:'Investigate action: test {I} vs the shroud; commit {I} cards. Success: take 1 clue from the location.'},
  {uk:'Якщо з тобою сражається ворог, дослідження викличе внеочередну атаку — спершу перемож його або ухилися.',ru:'Если с вами сражается враг, исследование вызовет внеочередную атаку — сначала победите его или уйдите.',en:'If an enemy is engaged with you, investigating provokes an attack of opportunity — defeat or evade it first.'},
  {uk:'Коли разом набрали потрібну кількість улик для сцени (теж часто з {per}) — витратьте їх і просуньте сцену. Це без дії.',ru:'Когда вместе набрали требуемое число улик для сцены (тоже часто с {per}) — потратьте их и продвиньте сцену. Это без действия.',en:'When you have the act\'s clue threshold together (often with {per}), spend them to advance the act. No action needed.'},
 ],
 tips:[
  {uk:'Перший хід: виклади головні активи — зброю, ліхтар, союзника. Ресурси в кишені нічого не роблять.',ru:'Первый ход: выложите главные активы — оружие, фонарь, союзника. Ресурсы в запасе ничего не делают.',en:'First turn: get your key assets out — weapon, flashlight, ally. Unspent resources do nothing.'},
  {uk:'«Взять ресурс» і «Взять карту» — тільки коли бракує. Дії, що дають улики чи прибирають ворогів, просувають сценарій.',ru:'«Взять ресурс» и «Взять карту» — только когда не хватает. Действия, дающие улики или убирающие врагов, двигают сценарий.',en:'Take Resource or Draw only when short. Actions that gain clues or remove enemies move the scenario forward.'},
  {uk:'Перед перевіркою цілься на навичку на 2 вище складності: у мішку багато жетонів −1…−2 і символів.',ru:'Перед проверкой цельтесь в навык на 2 выше сложности: в мешке много жетонов −1…−2 и символов.',en:'Aim for a skill 2 above the difficulty: the bag holds many −1/−2 tokens and symbols.'},
  {uk:'Тримай 1–2 навички в руці: їх можна додавати й до перевірок від напастей у фазі Мифа.',ru:'Держите 1–2 навыка на руке: их можно добавлять и к проверкам от напастей в фазе Мифа.',en:'Keep 1–2 skills in hand: you can commit them to treachery tests in the Mythos phase too.'},
  {uk:'Слідкуй за безвиходдю: скільки раундів лишилось до просування замислу. Не гайся на неважливому.',ru:'Следите за безысходностью: сколько раундов осталось до продвижения замысла. Не тратьте время на неважное.',en:'Watch the doom: count the rounds until the agenda advances. Do not waste time on side things.'},
  {uk:'Мисливці підуть за тобою. Перемож або відведи ворога, перш ніж досліджувати.',ru:'Охотники пойдут за вами. Победите или уведите врага, прежде чем исследовать.',en:'Hunters will follow you. Deal with the enemy before you investigate.'},
  {uk:'Дві руки: один бʼється, другий шукає улики. Стійте в одній локації, щоб додавати одне одному по 1 карті.',ru:'Две руки: один сражается, другой ищет улики. Стойте в одной локации, чтобы добавлять друг другу по 1 карте.',en:'Two-handed: one fights, one finds clues. Share a location so you can commit 1 card to each other\'s tests.'},
  {uk:'Колода 0 — замішай скид і отримай 1 жах. Не гортай колоду дарма.',ru:'Колода закончилась — замешайте сброс и получите 1 ужас. Не прокручивайте колоду зря.',en:'Running out of deck means 1 horror on reshuffle — do not churn needlessly.'},
 ],
 kw:[
  {n:{uk:'Сражатися',ru:'Сражаться',en:'Engaged'}, d:{uk:'Розвернутий ворог у твоїй локації, що ні з ким не сражається, одразу починає сражатися з тобою і лягає в зону загрози.',ru:'Развёрнутый враг в вашей локации, который ни с кем не сражается, сразу начинает сражаться с вами и кладётся в зону угрозы.',en:'A ready, unengaged enemy at your location engages you at once and goes to your threat area.'}},
  {n:{uk:'Виходить',ru:'Выходит',en:'Spawn'}, d:{uk:'Куди ставити ворога при появі.',ru:'Куда выкладывать врага при появлении.',en:'Where the enemy enters play.'}},
  {n:{uk:'Здобич',ru:'Добыча',en:'Prey'}, d:{uk:'Кого ворог обирає, якщо підходять кілька сищиків.',ru:'Кого враг выбирает, если подходят несколько сыщиков.',en:'Which investigator the enemy picks when several qualify.'}},
  {n:{uk:'Мисливець',ru:'Охотник',en:'Hunter'}, d:{uk:'У фазі ворогів рухається до найближчого сищика.',ru:'В фазе врагов перемещается к ближайшему сыщику.',en:'Moves toward the nearest investigator in the enemy phase.'}},
  {n:{uk:'Обережний',ru:'Осторожный',en:'Aloof'}, d:{uk:'Сам не сражається. Щоб атакувати, спершу дія «Начать сражаться».',ru:'Сам не вступает в схватку. Чтобы атаковать, сначала действие «Начать сражаться».',en:'Does not engage on its own. Use the Engage action before fighting it.'}},
  {n:{uk:'Месник',ru:'Мститель',en:'Retaliate'}, d:{uk:'Провалиш атаку по розвернутому — він атакує тебе.',ru:'Провалите атаку по развёрнутому — он атакует вас.',en:'Fail an attack against it while it is ready and it attacks you.'}},
  {n:{uk:'Пильний',ru:'Бдительный',en:'Alert'}, d:{uk:'Провалиш ухід — він атакує тебе.',ru:'Провалите уход — он атакует вас.',en:'Fail to evade it and it attacks you.'}},
  {n:{uk:'Величезний',ru:'Огромный',en:'Massive'}, d:{uk:'Сражається з усіма сищиками у своїй локації.',ru:'Сражается со всеми сыщиками в своей локации.',en:'Engaged with every investigator at its location.'}},
  {n:{uk:'Прагнення',ru:'Стремление',en:'Patrol'}, d:{uk:'У фазі ворогів рухається до вказаної локації.',ru:'В фазе врагов перемещается к указанной локации.',en:'Moves toward the named location in the enemy phase.'}},
  {n:{uk:'Елітний',ru:'Элитный',en:'Elite'}, d:{uk:'Багато ефектів на нього не діють («не элитный»).',ru:'Многие эффекты на него не действуют («не элитный»).',en:'Immune to many effects (“non-Elite”).'}},
  {n:{uk:'Наплив',ru:'Наплыв',en:'Surge'}, d:{uk:'Після цієї карти контакту візьми ще одну.',ru:'После этой карты контакта возьмите ещё одну.',en:'Draw another encounter card after this one.'}},
  {n:{uk:'Небезпека',ru:'Опасность',en:'Peril'}, d:{uk:'Виконуєш сам: інші не можуть додавати карти чи грати їх тобі на допомогу.',ru:'Разыгрываете сами: другие не могут добавлять карты или играть их вам на помощь.',en:'You resolve it alone: others cannot commit or play cards to help.'}},
  {n:{uk:'Перемога X',ru:'Победа X',en:'Victory X'}, d:{uk:'Переможеного ворога чи досліджену локацію клади на «победный счёт» — це досвід після сценарію.',ru:'Побеждённого врага или исследованную локацию кладите на победный счёт — это опыт после сценария.',en:'A defeated enemy or cleared location goes to the victory display — XP after the scenario.'}},
 ],
 more:[
  {uk:'Рани ≥ здоровʼя або жах ≥ розсудку — сищика переможено, він вибуває зі сценарію. У кампанії: від ран — 1 фізична травма, від жаху — 1 ментальна.', ru:'Раны ≥ здоровья или ужас ≥ рассудка — сыщик побеждён и выбывает из сценария. В кампании: от ран — 1 физическая травма, от ужаса — 1 ментальная.', en:'Damage ≥ health or horror ≥ sanity: the investigator is defeated and leaves the scenario. In a campaign: 1 physical trauma from damage, 1 mental trauma from horror.'},
  {uk:'Направлені рани/жах не можна перекласти на активи.', ru:'Направленные раны/ужас нельзя распределить на активы.', en:'Direct damage/horror cannot be assigned to assets.'},
  {uk:'«Обязательно» — спрацьовує саме, пропускати не можна. «Быстрое» {fast} і реакції {react} — без дії.', ru:'«Обязательно» — срабатывает само, пропускать нельзя. «Быстрое» {fast} и реакции {react} — без действия.', en:'Forced triggers on its own and cannot be skipped. Fast {fast} and reactions {react} cost no action.'},
  {uk:'Усі вибули — сценарій закінчено, читай відповідну розвʼязку.', ru:'Все выбыли — сценарий окончен, читайте соответствующую развязку.', en:'If everyone is eliminated the scenario ends — read the matching resolution.'},
 ],
 slots:{uk:'2 руки · 2 тайних (магічних) · 1 тіло · 1 аксесуар · 1 союзник · 1 таро', ru:'2 слота руки · 2 магических · 1 тела · 1 аксессуара · 1 союзника · 1 таро', en:'2 hand · 2 arcane · 1 body · 1 accessory · 1 ally · 1 tarot'},
};

let M = store.get('memo') || {round:1, ck:{}, setup:{}, n:1, act:[0,0,0,0]};
if(!M.act) M.act=[0,0,0,0];
let memoLang = store.get('memoLang') || null;
const ML = () => memoLang || (EN()?'en':'uk');
const saveM = () => store.set('memo', M);
let memoArmed = false;

const SKL = {W:['w','p',{uk:'В',ru:'В',en:'W'},{uk:'Воля',ru:'Воля',en:'Willpower'}],I:['i','b',{uk:'І',ru:'И',en:'I'},{uk:'Інтелект',ru:'Интеллект',en:'Intellect'}],C:['c','c',{uk:'Б',ru:'Б',en:'C'},{uk:'Бій',ru:'Бой',en:'Combat'}],A:['a','a',{uk:'С',ru:'Л',en:'A'},{uk:'Спритність',ru:'Ловкость',en:'Agility'}]};
const TOK = {skull:['k',{uk:'череп',ru:'череп',en:'skull'}],cultist:['l',{uk:'культист',ru:'культист',en:'cultist'}],tablet:['q',{uk:'табличка',ru:'табличка',en:'tablet'}],elder:['n',{uk:'древній',ru:'древний',en:'elder thing'}],fail:['m',{uk:'щупальця',ru:'щупальца',en:'tentacles'}],es:['o',{uk:'знак Старших богів',ru:'знак Старших богов',en:'Elder Sign'}],act:['i',{uk:'дія',ru:'действие',en:'action'}],fast:['j',{uk:'швидка',ru:'быстрое',en:'fast'}],react:['!',{uk:'реакція',ru:'реакция',en:'reaction'}],per:['u',{uk:'на сищика',ru:'на сыщика',en:'per investigator'}],bless:['v',{uk:'благословення',ru:'благословение',en:'bless'}],curse:['w',{uk:'прокляття',ru:'проклятие',en:'curse'}]};
const mt = (txt,lg) => esc(txt).replace(/\{([A-Za-z]+)\}/g,(m,k)=>{
  if(SKL[k]) return `<span class="ic ${SKL[k][0]}" title="${SKL[k][3][lg]}"><span class="g">${SKL[k][1]}</span><span class="l">${SKL[k][2][lg]}</span></span>`;
  if(TOK[k]) return `<span class="tok tok-${k}" title="${TOK[k][1][lg]}"><span class="g">${esc(TOK[k][0])}</span><span class="l">${TOK[k][1][lg]}</span></span>`;
  return m; });
function vMemo(){
  const lg = ML(), u = MEMO.ui[lg], ruTag = s => lg==='ru' ? '' : `<span class="ruterm">${u.ru}: ${esc(s)}</span>`;
  const langs = [['uk','УКР'],['ru','РУС'],['en','ENG']].map(([k,l])=>`<button class="chip" data-mlang="${k}" aria-pressed="${lg===k}">${l}</button>`).join('');
  const setup = MEMO.setup.map((s,i)=>`<label class="mstep" for="ms_${i}"><input type="checkbox" id="ms_${i}" data-msetup="${i}" ${M.setup[i]?'checked':''}><span>${esc(s[lg])}</span></label>`).join('');
  const sDone = MEMO.setup.filter((s,i)=>M.setup[i]).length;
  const phases = MEMO.phases.map((p,pi)=>{
    const skipped = p.skip1 && M.round===1;
    const done = p.steps.filter((s,si)=>M.ck[`${p.id}${si}`]).length;
    return `<section class="phase c-${({mys:'mystic',see:'seeker',sur:'survivor',gua:'guardian'})[p.c]} ${skipped?'skipped':''}">
      <div class="phead"><span class="pnum">${pi+1}</span><div class="ptitle"><b>${esc(p.n[lg])}</b>${ruTag(p.n.ru)}</div><span class="pdone">${skipped?'—':u.done(done,p.steps.length)}</span></div>
      ${skipped?`<p class="note">${u.skip}</p>`:''}

  }).join('');
  const pips = Array.from({length:M.n},(_,i)=>`<div class="arow"><span>${u.inv} ${i+1}</span><span class="pips">${[0,1,2].map(j=>`<button class="pip" data-pip="${i}:${j}" aria-pressed="${M.act[i]>j}" aria-label="${u.actsT} ${j+1}"></button>`).join('')}</span></div>`).join('');

  const test = MEMO.test.map((t,i)=>`<li><span class="tn">${i+1}</span><span>${mt(t[lg],lg)}</span></li>`).join('');
  const flow = arr => `<ol class="test">${arr.map((t,i)=>`<li><span class="tn">${i+1}</span><span>${mt(t[lg],lg)}</span></li>`).join('')}</ol>`;
  const types = MEMO.types.map(k=>`<div class="kw"><b>${esc(k.n[lg])}</b>${ruTag(k.n.ru)}<span>${mt(k.d[lg],lg)}</span></div>`).join('');
  const tips = MEMO.tips.map(m=>`<li>${mt(m[lg],lg)}</li>`).join('');
  const legend = ['W','I','C','A'].map(k=>`<span class="leg">${mt('{'+k+'}',lg)} ${SKL[k][3][lg]}</span>`).join('') + ['skull','cultist','tablet','elder','fail','es','act','fast','react','per'].map(k=>`<span class="leg">${mt('{'+k+'}',lg)} ${TOK[k][1][lg]}</span>`).join('');
  const kw = MEMO.kw.map(k=>`<div class="kw"><b>${esc(k.n[lg])}</b>${ruTag(k.n.ru)}<span>${mt(k.d[lg],lg)}</span></div>`).join('');
  const more = MEMO.more.map(m=>`<li>${mt(m[lg],lg)}</li>`).join('');
  return `<div class="memo" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel">
      <div class="toolbar"><h2>${u.title}</h2><span class="filters">${langs}</span></div>
      <p class="note">${u.lede}</p>
    </div>

      <p class="note">${u.setupNote}</p>${setup}<div class="btnrow"><button class="pbtn" data-msetupreset="1">${u.resetSetup}</button></div></details>

    <div class="phases">${phases}</div>
    <div class="panel"><div class="toolbar"><h3>${u.actions}</h3><span class="seg">${[1,2,3,4].map(n=>`<button data-mn="${n}" aria-pressed="${M.n===n}">${n}</button>`).join('')}</span></div><p class="note">${u.actNote}</p>${pips}</div>
    <div class="panel"><h3>${u.actsT}</h3><div class="acts">${acts}</div><p class="aoo">${mt(MEMO.aooNote[lg],lg)}</p></div>
    <div class="panel"><h3>${u.stT}</h3><ol class="test">${test}</ol></div>
    <div class="two"><div class="panel"><h3>${u.fightT}</h3>${flow(MEMO.fight)}</div><div class="panel"><h3>${u.investT}</h3>${flow(MEMO.invest)}</div></div>
    <div class="panel"><h3>${u.typesT}</h3><div class="kws">${types}</div></div>
    <div class="panel"><h3>${u.tipsT}</h3><ul class="more">${tips}</ul></div>
    <div class="panel"><h3>${u.kwT}</h3><div class="kws">${kw}</div></div>
    <div class="panel"><h3>${u.iconsT}</h3><div class="legend">${legend}</div></div>
    <div class="panel"><h3>${u.moreT}</h3><ul class="more">${more}</ul><h3>${u.slotsT}</h3><p>${esc(MEMO.slots[lg])}</p></div>
  </div>`;
}
function memoClick(el){
  const ds = el.dataset;
  if(ds.mlang){ memoLang = ds.mlang; store.set('memoLang', memoLang); render(); return true; }
  if(ds.mnext){ M.round++; M.ck={}; M.act=[0,0,0,0]; memoArmed=false; saveM(); render(); window.scrollTo({top:0}); return true; }
  if(ds.mreset){ if(!memoArmed){ memoArmed=true; render(); return true; } M={round:1,ck:{},setup:{},n:M.n,act:[0,0,0,0]}; memoArmed=false; saveM(); render(); return true; }
  if(ds.msetupreset){ M.setup={}; saveM(); render(); return true; }
  if(ds.mn){ M.n=+ds.mn; saveM(); render(); return true; }
  if(ds.pip){ const [i,j]=ds.pip.split(':').map(Number); M.act[i] = M.act[i]>j ? j : j+1; saveM(); render(); return true; }
  return false;
}
function memoChange(t){
  const ds=t.dataset;
  if(ds.mstep){ M.ck[ds.mstep]=t.checked; saveM(); render(); return true; }
  if(ds.msetup){ M.setup[ds.msetup]=t.checked; saveM(); render(); return true; }
  return false;
}

let GQ = '', GC = 'all', GOPEN = null, GS = store.get('glossSort') || 'abc';
const gkey = (e,lg) => e.n[lg].replace(/^[«"“„'(]+/,'');
const LOC = {uk:'uk',ru:'ru',en:'en'};
const gname = (e,lg) => e.n[lg];
function vGloss(){
  const lg = ML(), u = MEMO.ui[lg];
  const T = {uk:{title:'Довідник ключових слів',lede:'Пошук будь-якою з трьох мов. Тапни термін — побачиш пояснення й приклади карт.',ph:'Пошук: «Охотник», «Hunter», «Мисливець»',all:'Усі',none:'Нічого не знайдено.',ex:'Приклади карт',n:n=>`${n} термінів`},
             ru:{title:'Справочник ключевых слов',lede:'Поиск на любом из трёх языков. Нажмите термин — увидите пояснение и примеры карт.',ph:'Поиск: «Охотник», «Hunter», «Мисливець»',all:'Все',none:'Ничего не найдено.',ex:'Примеры карт',n:n=>`${n} терминов`},
             en:{title:'Keyword glossary',lede:'Search in any of the three languages. Tap a term for its explanation and example cards.',ph:'Search: “Hunter”, «Охотник», «Мисливець»',all:'All',none:'Nothing found.',ex:'Example cards',n:n=>`${n} terms`}}[lg];
  const langs = [['uk','УКР'],['ru','РУС'],['en','ENG']].map(([k,l])=>`<button class="chip" data-mlang="${k}" aria-pressed="${lg===k}">${l}</button>`).join('');
  const q = GQ.trim().toLowerCase();
  const list = G.map((e,ix)=>({e,ix})).filter(({e})=> (GC==='all'||e.c===GC) && (!q || ['uk','ru','en'].some(k=>e.n[k].toLowerCase().includes(q)||e.d[k].toLowerCase().includes(q))));
  const cats = `<button class="chip" data-gcat="all" aria-pressed="${GC==='all'}">${T.all}</button>`+Object.entries(GCAT).map(([k,v])=>`<button class="chip" data-gcat="${k}" aria-pressed="${GC===k}">${esc(v[lg])}</button>`).join('');
  list.sort((a,b)=>gkey(a.e,lg).localeCompare(gkey(b.e,lg),LOC[lg],{sensitivity:'base'}));
  const groups = [];
  if(GS==='abc'){ for(const x of list){ const L0=gkey(x.e,lg).charAt(0).toLocaleUpperCase(LOC[lg]); let g=groups[groups.length-1]; if(!g||g.h!==L0){ g={h:L0,items:[]}; groups.push(g);} g.items.push(x); } }
  else { for(const [ck,cv] of Object.entries(GCAT)){ const items=list.filter(x=>x.e.c===ck); if(items.length) groups.push({h:cv[lg],items}); } }
  let body='';
  for(const grp of groups){
    const items=grp.items;
    body+=`<h3 class="gh ${GS==='abc'?'gletter':''}">${esc(grp.h)}</h3><div class="gl">`+items.map(({e,ix})=>{
      const open = GOPEN===ix || (q && list.length<=3);
      const others = ['uk','ru','en'].filter(k=>k!==lg).map(k=>`<span class="gother"><i>${k==='uk'?'укр':k==='ru'?'рус':'eng'}</i> ${esc(e.n[k])}</span>`).join('');
      const ex = (e.ex||[]).filter(k=>C[k]);
      return `<div class="gitem ${open?'open':''}"><button class="ghead" data-gopen="${ix}" aria-expanded="${open}">${e.i?mt('{'+e.i+'}',lg):''}<span class="gn">${esc(gname(e,lg))}</span><span class="gos">${others}</span></button>
        ${open?`<div class="gbody"><p>${mt(e.d[lg],lg)}</p>${ex.length?`<div class="gex"><span class="note">${T.ex}:</span>${ex.map(k=>`<button class="gcard c-${C[k].f}" data-card="${k}"><span class="dot"></span>${esc(lg==='en'?C[k].en:C[k].ru)}</button>`).join('')}</div>`:''}</div>`:''}</div>`;
    }).join('')+`</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="panel"><div class="toolbar"><h2>${T.title}</h2><span class="filters">${langs}</span></div><p class="note">${T.lede}</p></div>
    <input class="search" id="gq" type="search" placeholder="${esc(T.ph)}" value="${esc(GQ)}" aria-label="${esc(T.ph)}">
    <div class="toolbar"><span class="seg"><button data-gsort="abc" aria-pressed="${GS==='abc'}">${{uk:['За абеткою','За категоріями'],ru:['По алфавиту','По категориям'],en:['A–Z','By category']}[lg][0]}</button><button data-gsort="cat" aria-pressed="${GS==='cat'}">${{uk:['За абеткою','За категоріями'],ru:['По алфавиту','По категориям'],en:['A–Z','By category']}[lg][1]}</button></span></div>
    <div class="filters">${cats}</div>
    <p class="note" id="gcount">${T.n(list.length)}</p>
    <div id="gbody" class="panel">${body||`<p class="note">${T.none}</p>`}</div>
  </div>`;
}
function glossClick(el){
  const ds=el.dataset;
  if(ds.gcat){ GC=ds.gcat; render(); return true; }
  if(ds.gsort){ GS=ds.gsort; store.set('glossSort',GS); render(); return true; }
  if(ds.gopen!==undefined){ const i=+ds.gopen; GOPEN = GOPEN===i ? null : i; render(); return true; }
  return false;
}
function glossInput(t){
  if(t.id!=='gq') return false;
  GQ=t.value;
  const tmp=document.createElement('div'); tmp.innerHTML=vGloss();
  document.getElementById('gbody').replaceWith(tmp.querySelector('#gbody'));
  document.getElementById('gcount').textContent=tmp.querySelector('#gcount').textContent;
  return true;
}

/* ---------- views ---------- */
const view = document.getElementById('view');
const isFav = id => S.favs.includes(id);
const stars = n => '●'.repeat(n)+'○'.repeat(3-n);

function tileHtml(d, pool){
  const inv=C[d.inv], a=adapt(d,pool), g=gotCount(d,a.list), t=total(a.list), l=L();
  return `<div class="tilew"><button class="tile c-${inv.f}" data-go="${d.id}">${portrait(d.inv)}<span class="tx">
      <span class="tag">${l.fac[inv.f]}</span>
      <span class="nm">${esc(nm(d.inv))}</span><span class="en">${esc(nm2(d.inv))}</span>
      <span class="ti">${esc(dTitle(d))}</span>
      <span class="meta"><span>${dRoles(d)}${a.subs.length?` · <span class="subbadge" style="margin:0">${l.subsN(a.subs.length)}</span>`:''}</span><span class="stars" title="${l.difficulty}">${stars(d.diff)}</span></span>
      <span class="prog" title="${l.collected(g,t)}"><i style="width:${Math.round(g/t*100)}%"></i></span>
    </span></button><button class="star" data-fav="${d.id}" aria-pressed="${isFav(d.id)}" aria-label="${l.fav}">★</button></div>`;
}
function vDecks(){
  const pool=S.pool, avail=decksIn(pool), l=L();
  const nf = avail.filter(d=>isFav(d.id)).length;
  const fl = `<div class="filters"><button class="chip" data-filter="all" aria-pressed="${S.filter==='all'}">${l.all} (${avail.length})</button><button class="chip" data-filter="fav" aria-pressed="${S.filter==='fav'}">${l.favs} (${nf})</button>${ORDER.slice(0,5).map(f=>`<button class="chip c-${f}" data-filter="${f}" aria-pressed="${S.filter===f}"><span class="dot"></span>${l.fac[f]}</button>`).join('')}</div>`;
  const shown = avail.filter(d=> S.filter==='all' || (S.filter==='fav'? isFav(d.id) : C[d.inv].f===S.filter));
  const banner = pool.length<ALLBOX.length ? `<div class="banner"><span>${l.bannerPool(esc(poolLabel(pool)))}</span><button data-tabgo="coll">${l.change}</button></div>` : '';
  return `<div style="display:flex;flex-direction:column;gap:12px">${banner}${fl}
    <div class="tiles">${shown.map(d=>tileHtml(d,pool)).join('') || `<p class="note">${S.filter==='fav'?l.noFavs:l.noneFilter}</p>`}</div>
    <p class="note">${l.tilesNote}</p></div>`;
}
function sortRows(list){
  const rows = list.map(([n,k])=>({n,k,c:C[k]}));
  rows.sort((a,b)=> ORDER.indexOf(a.c.f)-ORDER.indexOf(b.c.f) || a.c.xp-b.c.xp || TORD.indexOf(a.c.t)-TORD.indexOf(b.c.t) || (a.c.cost??-1)-(b.c.cost??-1) || nm(a.k).localeCompare(nm(b.k)));
  return rows;
}
function vDeck(id){
  const d=deckById(id), inv=C[d.inv], s=d.stats, ch=checks(id), pool=activePool(), a=adapt(d,pool), rows=sortRows(a.list), l=L();
  const curve=[0,0,0,0,0,0,0], icons=[0,0,0,0,0], types={event:0,skill:0,asset:0};
  rows.forEach(r=>{ if(r.c.cost!=null) curve[Math.min(6,Math.max(0,r.c.cost))]+=r.n; r.c.ic.forEach((v,j)=>icons[j]+=v*r.n); types[r.c.t]+=r.n; });
  const mx=Math.max(...curve,1);
  const bars = curve.map((v,j)=>`<div class="bar"><b>${v||''}</b><i style="height:${Math.round(v/mx*60)}px"></i><span>${j===6?'6+':j}</span></div>`).join('');
  let body='';
  for(const fc of ORDER){
    const fr=rows.filter(r=>r.c.f===fc); if(!fr.length) continue;
    body+=`<div class="ghead c-${fc}"><span class="dot"></span>${l.fac[fc]}<span class="cnt">${fr.reduce((x,r)=>x+r.n,0)}</span></div>`;
    for(const t of TORD){

function conflicts(a,b,pool){ const cnt={}; [a,b].forEach(d=>adapt(d,pool).list.forEach(([n,k])=>cnt[k]=(cnt[k]||0)+n)); return Object.entries(cnt).filter(([k,n])=>n>qtyIn(k,pool)).map(([k,n])=>({k,n})); }

}
function checkPair(){

    `<p class="bad">${l.pairBad(c.length)}</p><div class="grid">${c.map(x=>scan(x.k,0)).join('')}</div><div class="tw"><table><tr><th>${l.card}</th><th>${l.need}</th><th>${l.have}</th></tr>${c.map(x=>`<tr><td>${esc(nm(x.k))}</td><td>${x.n}</td><td>${qtyIn(x.k,S.pool)}</td></tr>`).join('')}</table></div><p class="note">${l.pairFix}</p>`;

const KEYRE = /^(chk_|favs$|pool$|camps$|mode$|filter$|lang$)/;
function exportState(){
  const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(KEYRE.test(k)) o[k]=localStorage.getItem(k); } }catch(e){}
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function importState(code){
  const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  Object.entries(o).forEach(([k,v])=>{ if(KEYRE.test(k)) try{localStorage.setItem(k,v)}catch(e){} });
  S.pool=(store.get('pool')||ALLBOX).filter(b=>ALLBOX.includes(b)); S.favs=store.get('favs')||[]; S.camps=store.get('camps')||[]; S.mode=store.get('mode')||'grid'; S.lang=store.get('lang')||S.lang; cache.clear();
  return Object.keys(o).length;
}
