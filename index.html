<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Аркхем">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Колоди Аркхема</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: архівна картотека — плитки справ-сищиків; справа відкривається як окремий аркуш; карти як мініатюри з корінцем класу */
:root{
  /* Ніч в Аркемі: чорнильно-зелене тло, пергаментні аркуші справ, кольори класів як на картах */
  color-scheme:dark;
  --night:#0d1311; --night2:#16201c; --bg:#0d1311;
  --paper:#e6dcc3; --paper2:#d8ccad; --ink:#231d16; --muted:#6b5f4c; --line:#b9aa86;
  --glow:#9ec7a6; --brass:#b08d4a; --fg:#e4dcc8; --fgm:#a59c88;
  --accent:#2e5b44;
  --gua:#2b6cb0; --see:#c27318; --rog:#1f7a3c; --mys:#5b3cb0; --sur:#b12f38; --neu:#6f6a5e;
  --wil:#3f57a3; --int:#9c5c22; --com:#a1323a; --agi:#2a7445; --wild:#7d6a24;
  --chip:#d3c6a4; --scrim:rgba(4,8,6,.72); --onc:#ffffff;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% -10%, #1f3a2e 0%, transparent 60%), radial-gradient(90% 60% at 100% 110%, #1b2a3a 0%, transparent 55%), var(--night);background-attachment:fixed;color:var(--fg);min-height:100vh;font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);mix-blend-mode:screen}
.wrap{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:400 clamp(2rem,6vw,2.8rem)/1 var(--f-display);margin:0;text-wrap:balance;color:var(--fg);letter-spacing:.02em;text-shadow:0 0 18px rgba(158,199,166,.25)}
h2{font:400 1.5rem/1.1 var(--f-display);margin:0;text-wrap:balance}
h3{font:800 .76rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--fgm);margin:0}
.panel h3,.sheet h3{color:var(--muted)}
.panel,.tile,.sheet,.pair{color:var(--ink)}
p{margin:0}
.lede{color:var(--fgm);max-width:62ch;margin-top:6px}
.note{font-size:.88rem;color:var(--fgm)}
.panel .note,.sheet .note,.tile .note{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top, 0px);background:var(--night);padding-block:10px;z-index:5;border-bottom:1px solid #2c3a33;scrollbar-width:none}
.tab{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.c-guardian{--c:var(--gua)} .c-seeker{--c:var(--see)} .c-rogue{--c:var(--rog)} .c-mystic{--c:var(--mys)} .c-survivor{--c:var(--sur)} .c-neutral{--c:var(--neu)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* investigator tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%),var(--paper);border:0;border-radius:6px;padding:0;text-align:left;display:grid;grid-template-columns:92px 1fr;min-width:0;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.45);color:var(--ink)}
.tile .tx{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:4px solid var(--c)}
.portrait{background:var(--c) center/cover no-repeat;position:relative;min-height:128px;box-shadow:inset -6px 0 10px rgba(0,0,0,.25)}
.portrait.has{background-size:auto 165%;background-position:5% 22%}
.portrait .ini{position:absolute;inset:0;display:grid;place-items:center;font:400 2.2rem var(--f-display);color:rgba(255,255,255,.85)}
.portrait.has .ini{display:none}
.tile:hover{transform:translateY(-1px)}
.tile{transition:transform .15s}
.tile .nm{font:400 1.25rem/1.1 var(--f-display)}
.tile .en{font-size:.82rem;color:var(--muted)}
.tile .ti{font-size:.92rem}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;margin-top:auto}
.tag{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.prog{height:4px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.stars{font-family:var(--f-mono);letter-spacing:1px}

/* deck view */
.deckhead{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.deckhead .portrait{min-height:110px;border-radius:50%;box-shadow:0 0 0 3px var(--c),0 0 0 6px rgba(176,141,74,.5),0 10px 30px rgba(0,0,0,.6)}
.deckhead .portrait.has{background-size:auto 210%;background-position:6% 18%}
.deckhead h2{font-size:clamp(1.6rem,5vw,2.2rem);color:var(--fg)}
.deckhead .note{color:var(--fgm)}
.deckhead .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.back{align-self:flex-start;border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.st{font-family:var(--f-mono);font-size:.82rem;border:1px solid #3a4a41;border-radius:4px;padding:3px 8px;background:var(--night2);color:var(--fg)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),var(--paper);box-shadow:0 6px 22px rgba(0,0,0,.45);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:88px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--c);border-radius:2px 2px 0 0;min-height:2px}
.bar b{font:600 .72rem var(--f-mono);color:var(--ink)}
.bar span{font:500 .72rem var(--f-mono);color:var(--muted)}
.iconsum{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.88rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.reset{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 9px;font-size:.82rem}
.ghead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;margin-top:8px;padding-bottom:3px;border-bottom:2px solid var(--c);color:var(--c)}
.ghead .cnt{margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-weight:500}
.ghead .ru{font-weight:500;color:var(--muted)}
.sublabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 2px}
.row{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;border-bottom:1px dashed var(--line)}
.row input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.rowbtn{border:0;background:transparent;text-align:left;padding:6px 2px;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;min-width:0}
.rowbtn .n{font-family:var(--f-mono)}
.rowbtn .t{min-width:0}
.rowbtn .t b{font-weight:700;display:block}
.rowbtn .t i{font-style:normal;color:var(--muted);font-size:.84rem}
.right{display:flex;gap:6px;align-items:center}
.row:has(input:checked) .t{opacity:.42;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.scan{position:relative;border:0;padding:0;background:transparent;border-radius:9px;overflow:hidden;aspect-ratio:63/88;max-width:100%;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan .qty{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font:600 .8rem var(--f-mono);border-radius:4px;padding:1px 7px}
.scan.got{opacity:.4}
.scan.land{aspect-ratio:88/63}
.bigscan{width:100%;border-radius:12px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.6)}

/* mini card */
.mc{position:relative;border:0;padding:0;background:var(--paper);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);min-width:0}
.mc .band{background:var(--c);color:var(--onc);padding:8px 8px 10px 44px;min-height:54px;position:relative;display:flex;flex-direction:column;justify-content:center}
.mc .band b{font-weight:800;font-size:.95rem;line-height:1.1;color:#fff}
.mc .band i{font-style:normal;font-size:.74rem;opacity:.85;color:#fff}
.mc .costb{position:absolute;left:7px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:600 .95rem var(--f-mono);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.mc .lvl{position:absolute;left:7px;top:41px;width:30px;text-align:center;font-size:.6rem;letter-spacing:1px;color:#fff}
.mc .bodyc{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.mc .type{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mc .tr{font-size:.8rem;font-style:italic;color:var(--muted)}
.mc .qty{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.35);color:#fff;font:600 .78rem var(--f-mono);border-radius:4px;padding:1px 6px}
.mc.got{opacity:.45}
.mc.big .band{min-height:80px;padding-left:58px}
.mc.big .band b{font-size:1.25rem}
.mc.big .costb{width:40px;height:40px;font-size:1.15rem;top:12px}
.mc.big .lvl{top:56px;width:40px;font-size:.75rem}
.icons{display:flex;gap:3px;flex-wrap:wrap}
.ic{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:4px;color:#fff;font:700 .72rem var(--f-body)}
.ic.w{background:var(--wil)} .ic.i{background:var(--int)} .ic.c{background:var(--com)} .ic.a{background:var(--agi)} .ic.x{background:var(--wild)}
.icn{font:600 .8rem var(--f-mono);display:inline-flex;gap:4px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%),var(--paper);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet .close{align-self:flex-end;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:8px 14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}

ol.ups{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.ups li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.xp{font-family:var(--f-mono);background:var(--chip);border-radius:4px;text-align:center;padding:2px 0;font-size:.85rem}
.swap{min-width:0;font-size:.93rem}
.swap button{border:0;background:transparent;padding:0;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.swap .why{color:var(--accent);font-size:.85rem;display:block}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid #3a4a41;border-radius:6px;background:var(--night2);color:var(--fg)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);flex:1 1 200px;min-width:0}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--rog);font-weight:700}.bad{color:var(--sur);font-weight:700}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pair{border:0;border-radius:6px;padding:10px;background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.4);text-align:left;display:flex;flex-direction:column;gap:4px}
.pair b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.pair span{font-size:.86rem;color:var(--muted)}
.pair .faces{display:flex;gap:6px}
.pair .faces .portrait{width:48px;min-height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.pair .faces .portrait.has{background-size:auto 220%;background-position:6% 18%}
.pair .faces .portrait .ini{font-size:1.2rem}
.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.guide li{max-width:65ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>

<div class="wrap">
  <header style="display:flex;gap:14px;align-items:center">
    <svg width="54" height="54" viewBox="0 0 100 100" aria-hidden="true" style="flex:none;filter:drop-shadow(0 0 8px rgba(158,199,166,.35))"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d4a" stroke-width="2.5"/><circle cx="50" cy="50" r="39" fill="none" stroke="#b08d4a" stroke-width="1"/><path d="M50 14 L60.6 77 L16 38 L84 38 L39.4 77 Z" fill="none" stroke="#9ec7a6" stroke-width="2.5" stroke-linejoin="round"/><circle cx="50" cy="50" r="6" fill="#9ec7a6"/></svg>
    <div>
    <h1>Колоди Аркхема</h1>
    <p class="lede">32 стартові колоди тільки з твоїх карт. Тапни сищика, щоб побачити колоду. Тапни карту, щоб побачити скан і деталі.</p>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="decks" aria-selected="true">Сищики</button>

    <button class="tab" role="tab" data-tab="pairs" aria-selected="false">Дві руки</button>
    <button class="tab" role="tab" data-tab="xp" aria-selected="false">Досвід</button>
  </nav>
  <main id="view"></main>

function hydrate(root=document){

    const tryNext=()=>{ if(i>=urls.length) return; const u=urls[i++]; const im=new Image(); im.onload=()=>{el.style.backgroundImage=`url("${u}")`; el.classList.add('has');}; im.onerror=tryNext; im.src=u; };
    tryNext();
  });

  if(i<urls.length){ im.dataset.i=i; im.src=urls[i]; return; }
  failed.add(k);

  if(b){ const t=document.createElement('div'); t.innerHTML=mini(k,+b.dataset.n,b.dataset.cls); b.replaceWith(t.firstElementChild); }

      <div>${body}</div>
    </div>
    <div class="panel"><h3>Прокачка за досвід — по черзі</h3><ol class="ups">${ups}</ol><p class="note">Ліворуч — що вийняти, праворуч — що покласти. Тапни назву, щоб побачити карту.</p></div>
  </div>`;
}

function vCards(){
  const keys=Object.keys(usedIn).filter(k=>{const c=C[k]; if(state.cf!=='all'&&c.f!==state.cf&&c.f2!==state.cf) return false; const q=state.q.trim().toLowerCase(); return !q||c.ru.toLowerCase().includes(q)||c.en.toLowerCase().includes(q);});
  keys.sort((a,b)=>{const x=C[a],y=C[b]; return ORDER.indexOf(x.f)-ORDER.indexOf(y.f)||x.xp-y.xp||TORD.indexOf(x.t)-TORD.indexOf(y.t)||(x.cost??-1)-(y.cost??-1)||x.ru.localeCompare(y.ru);});
  const fl = `<div class="filters"><button class="chip" data-cf="all" aria-pressed="${state.cf==='all'}">Усі</button>${ORDER.map(f=>`<button class="chip c-${f}" data-cf="${f}" aria-pressed="${state.cf===f}"><span class="dot"></span>${FAC[f]}</button>`).join('')}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <input class="search" id="q" type="search" placeholder="Пошук: «Нож» або «Knife»" value="${esc(state.q)}" aria-label="Пошук карти">
    ${fl}
    <p class="note">${keys.length} карт, які йдуть у ці колоди. Тап — превʼю і в яких колодах карта.</p>
    <div class="grid" id="cardgrid">${keys.map(k=>scan(k,usedIn[k].length>1?usedIn[k].length:0)).join('')||'<p class="empty">Нічого не знайдено.</p>'}</div>
    <p class="note">Число в куті — у скількох колодах карта використовується.</p>
  </div>`;
}

function conflicts(a,b){ const cnt={}; [a,b].forEach(d=>d.list.forEach(([n,k])=>cnt[k]=(cnt[k]||0)+n)); return Object.entries(cnt).filter(([k,n])=>n>C[k].q).map(([k,n])=>({k,n})); }
function vPairs(){
  const opts = D.map(d=>`<option value="${d.id}">${esc(C[d.inv].ru)} — ${esc(d.title)}</option>`).join('');
  const good = GOOD.map(([x,y])=>{const a=deckById(x), b=deckById(y); return `<button class="pair" data-pa="${x}" data-pb="${y}"><span class="faces">${portrait(a.inv)}${portrait(b.inv)}</span><b>${esc(C[a.inv].ru)} + ${esc(C[b.inv].ru)}</b><span>${a.roles.join(', ')} · ${b.roles.join(', ')}</span></button>`;}).join('');
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>Перевірити пару</h2><p class="note">Обидві колоди лежать на столі одночасно, тож карт має вистачити на дві.</p>
      <div class="sel"><select id="pa" aria-label="Перша колода">${opts}</select><select id="pb" aria-label="Друга колода">${opts}</select></div><div id="pres"></div></div>
    <h3>Добрі пари: боєць + шукач, карт вистачає на обох</h3><div class="pairs">${good}</div></div>`;
}
function checkPair(){
  const a=deckById(document.getElementById('pa').value), b=deckById(document.getElementById('pb').value), r=document.getElementById('pres');
  if(a===b){ r.innerHTML='<p class="note">Вибери дві різні колоди.</p>'; return; }
  const c=conflicts(a,b);
  r.innerHTML = c.length===0 ? '<p class="ok">Карт вистачає на обидві колоди.</p>' :
    `<p class="bad">Не вистачає ${c.length} ${c.length===1?'карти':'карт'}:</p><div class="grid">${c.map(x=>scan(x.k,0)).join('')}</div><div class="tw"><table><tr><th>Карта</th><th>Треба</th><th>Є</th></tr>${c.map(x=>`<tr><td>${esc(C[x.k].ru)}</td><td>${x.n}</td><td>${C[x.k].q}</td></tr>`).join('')}</table></div><p class="note">Простий вихід: в одній з колод заміни зайву копію на іншу нейтральну навичку (Храбрость, Проницательность, Превозможение) або на вільну карту того ж класу рівня 0.</p>`;
}

function vXP(){ return document.getElementById('xptpl').innerHTML; }

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===state.tab));
  if(state.tab==='decks') view.innerHTML = state.deck ? vDeck(state.deck) : vDecks();
  else if(state.tab==='cards') view.innerHTML = vCards();
  else if(state.tab==='pairs'){ view.innerHTML = vPairs(); document.getElementById('pa').value=state.pa||'mark'; document.getElementById('pb').value=state.pb||'daisy'; checkPair(); }
  else view.innerHTML = vXP();
  hydrate(view);
}
function go(kind,id){ if(kind==='deck'){ state.tab='decks'; state.deck=id; render(); window.scrollTo({top:0}); } }

document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(!t) return; state.tab=t.dataset.tab; if(t.dataset.tab==='decks') state.deck=null; render();});
view.addEventListener('click',e=>{
  const el=e.target.closest('[data-card],[data-go],[data-back],[data-filter],[data-mode],[data-reset],[data-cf],[data-pa]');
  if(!el) return;
  if(el.dataset.card) return openCard(el.dataset.card);
  if(el.dataset.go) return go('deck',el.dataset.go);
  if(el.dataset.back){ state.deck=null; render(); return; }
  if(el.dataset.filter){ state.filter=el.dataset.filter; store.set('filter',state.filter); render(); return; }
  if(el.dataset.mode){ state.mode=el.dataset.mode; store.set('mode',state.mode); render(); return; }
  if(el.dataset.reset){ store.set('chk_'+state.deck,{}); render(); return; }
  if(el.dataset.cf){ state.cf=el.dataset.cf; render(); return; }
  if(el.dataset.pa){ state.pa=el.dataset.pa; state.pb=el.dataset.pb; render(); return; }
});
view.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ck){ const ch=checks(state.deck); ch[t.dataset.ck]=t.checked; store.set('chk_'+state.deck,ch);
    const h=view.querySelector('.toolbar h3'); const d=deckById(state.deck); if(h) h.textContent=`Колода · ${total(d)} карт · зібрано ${gotCount(d)}`; }
  if(t.id==='pa'||t.id==='pb'){ state.pa=document.getElementById('pa').value; state.pb=document.getElementById('pb').value; checkPair(); }
});
view.addEventListener('input',e=>{
  if(e.target.id!=='q') return;
  state.q=e.target.value;
  const tmp=document.createElement('div'); tmp.innerHTML=vCards();
  document.getElementById('cardgrid').replaceWith(tmp.querySelector('#cardgrid'));
  const note=view.querySelector('.note'); if(note) note.textContent=tmp.querySelector('.note').textContent;
});
render();
</script>

<template id="xptpl">
  <div class="guide" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>Звідки досвід і коли його витрачати</h2><ul>
      <li>Після кожного сценарію рахуєш досвід: очки перемоги з карт у «переможній зоні» плюс те, що дає розвʼязка сценарію. Записуй у журнал кампанії.</li>
      <li>Витрачаєш його тільки <b>між сценаріями</b>. Можна копити на дорогу карту.</li>
      <li>Розмір колоди не змінюється: щоб додати карту, прибери іншу.</li></ul></div>
    <div class="panel"><h2>Скільки коштує</h2><div class="tw"><table>
      <tr><th>Що робиш</th><th>Ціна</th></tr>
      <tr><td>Покращуєш карту до версії з тією ж назвою (Иссушение 0 → Иссушение 3)</td><td>різниця рівнів: 3</td></tr>
      <tr><td>Додаєш нову карту рівня 1–5</td><td>її рівень</td></tr>
      <tr><td>Додаєш нову карту рівня 0</td><td>1 XP</td></tr>
      <tr><td>Карти, які кампанія сама дає (сюжетні, слабкості)</td><td>безкоштовно</td></tr></table></div>
      <p class="note">Рівень — кількість крапок під ціною карти. Без крапок = рівень 0.</p></div>
    <div class="panel"><h2>Як вибирати покупки</h2><ul>
      <li><b>Спершу закрий слабке місце.</b> Боєць без пристойної зброї, шукач без способу втекти від ворога — перші покупки.</li>
      <li><b>Потім — ядро стилю.</b> Те, що сищик робить щоходу: зброя, книга, заклинання.</li>
      <li><b>Дешеві навички L1–2 — найвигідніші.</b> «Дедукція 2», «Пісня мертвих», «Один на один» коштують 1–2 XP і грають кожну гру.</li>
      <li><b>Дорогі «бомби» (4–5 XP)</b> купуй у другій половині кампанії, коли основа вже стоїть.</li>
      <li>У кожній колоді є готова черга покупок з порахованою ціною.</li></ul></div>
    <div class="panel"><h2>Соло і дві руки</h2><ul>
      <li><b>Одна рука</b> — гнучкий сищик, що і бʼє, і шукає: Роланд, Дженні, Агнес, Піт, Джим.</li>
      <li><b>Дві руки</b> — пара «боєць + шукач». У вкладці «Дві руки» перевір, чи вистачить карт на обох.</li>
      <li>Кожна колода бере <b>1 випадкову базову слабкість</b>. Сигнатурні карти сищика в 30 не входять.</li></ul></div>
  </div>
</template>

</body>
</html>
