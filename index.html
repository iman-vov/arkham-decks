  if(ds.newcamp){ S.newCamp=true; S.nc=null; render(); return; }
  if(ds.cancelcamp){ S.newCamp=false; render(); return; }
  if(ds.ncinv){ const nc=S.nc; nc.name=document.getElementById('nc_name').value; nc.inv = nc.inv.includes(ds.ncinv) ? nc.inv.filter(x=>x!==ds.ncinv) : (nc.inv.length<4 ? nc.inv.concat(ds.ncinv) : nc.inv); render(); return; }
  if(ds.createcamp){ const nc=S.nc; nc.name=document.getElementById('nc_name').value.trim() || campName(nc.cycle);
    const c={id:uid(), name:nc.name, cycle:nc.cycle, pool:nc.pool.slice(), inv:nc.inv.map(id=>({deck:id,xp:0,pt:0,mt:0,bought:[]})), notes:''};
    S.camps.push(c); saveCamps(); S.newCamp=false; S.camp=c.id; render(); return; }
  if(ds.opencamp){ S.camp=ds.opencamp; S.armed=null; render(); return; }
  if(ds.closecamp){ S.camp=null; S.armed=null; render(); return; }
  if(ds.campdeck){ const c=campById(S.camp); go(ds.campdeck, {name:c.name, pool:c.pool}); return; }
  if(ds.ctr){ const [ix,f,dv]=ds.ctr.split(':'); const c=campById(S.camp), iv=c.inv[+ix]; iv[f]=Math.max(0,(iv[f]||0)+ +dv); saveCamps(); render(); return; }
  if(ds.rminv){ if(S.armed!=='rm'+ds.rminv){ S.armed='rm'+ds.rminv; render(); return; } const c=campById(S.camp); c.inv.splice(+ds.rminv,1); S.armed=null; saveCamps(); render(); return; }
  if(ds.addinv){ const c=campById(S.camp); const id=document.getElementById('addinv').value; c.inv.push({deck:id,xp:0,pt:0,mt:0,bought:[]}); saveCamps(); render(); return; }
  if(ds.delcamp){ if(S.armed!=='del'){ S.armed='del'; render(); return; } S.camps=S.camps.filter(c=>c.id!==S.camp); S.camp=null; S.armed=null; saveCamps(); render(); return; }
});
function updCount(){ const h=document.getElementById('deckcount'); if(!h) return; const d=deckById(S.deck), l=adapt(d,activePool()).list; h.textContent=L().deckT(total(l),gotCount(d,l)); }
view.addEventListener('change',e=>{
  const t=e.target, ds=t.dataset;
  if(memoChange(t)) return;
  if(ds.ck){ toggleCheck(S.deck, ds.ck); updCount(); return; }
  if(t.id==='pa'||t.id==='pb'){ S.pa=document.getElementById('pa').value; S.pb=document.getElementById('pb').value; checkPair(); return; }
  if(ds.pool){ S.pool = t.checked ? ALLBOX.filter(k=>S.pool.includes(k)||k===ds.pool) : S.pool.filter(k=>k!==ds.pool); store.set('pool',S.pool); render(); return; }
  if(ds.nc){ const nc=S.nc; nc.name=document.getElementById('nc_name').value; nc.pool = t.checked ? ALLBOX.filter(k=>nc.pool.includes(k)||k===ds.nc) : nc.pool.filter(k=>k!==ds.nc); nc.inv = nc.inv.filter(id=>invAvailable(deckById(id),nc.pool)); render(); return; }
  if(t.id==='nc_cycle'){ S.nc.cycle=t.value; S.nc.name=document.getElementById('nc_name').value; return; }
  if(ds.buy){ const [ix,i]=ds.buy.split(':').map(Number); const c=campById(S.camp), iv=c.inv[ix]; iv.bought = t.checked ? iv.bought.concat(i) : iv.bought.filter(x=>x!==i); saveCamps(); render(); const det=view.querySelectorAll('.invrow details')[ix]; if(det) det.open=true; return; }
});
view.addEventListener('input',e=>{
  if(glossInput(e.target)) return;
  if(e.target.id==='campnotes'){ const c=campById(S.camp); c.notes=e.target.value; saveCamps(); return; }
  if(e.target.id!=='q') return;
  S.q=e.target.value;
  const tmp=document.createElement('div'); tmp.innerHTML=vCards();
  document.getElementById('cardgrid').replaceWith(tmp.querySelector('#cardgrid'));
  document.getElementById('cardcount').textContent=tmp.querySelector('#cardcount').textContent;
  hydrate(view);
});
render();
(function(){ const ok=()=>{ document.documentElement.classList.add('ahfont'); const e=document.getElementById('iconstat'); if(e) e.textContent='· іконки / icons ✓'; };
  const probe=()=>{ try{ if(document.fonts.check('16px ahicons','p')){ const c=document.createElement('canvas').getContext('2d'); c.font='40px ahicons, monospace'; const w1=c.measureText('pbcak').width; c.font='40px monospace'; const w2=c.measureText('pbcak').width; if(Math.abs(w1-w2)>0.5) ok(); } }catch(e){} };
  try{ if(document.fonts && document.fonts.load){ document.fonts.load('16px ahicons','pbca').then(fs=>{ if(fs && fs.length) ok(); else probe(); }).catch(probe); document.fonts.ready.then(probe); } }catch(e){}
  setTimeout(probe,2500); })();

</script>

<template id="xptpl">
  <div class="guide" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>Звідки досвід і коли його витрачати</h2><ul>
      <li>Після кожного сценарію рахуєш досвід: очки перемоги з карт у «переможній зоні» плюс те, що дає розвʼязка сценарію. Записуй у журнал кампанії.</li>
      <li>Витрачаєш його тільки <b>між сценаріями</b>. Можна копити на дорогу карту.</li>
      <li>Розмір колоди не змінюється: щоб додати карту, прибери іншу.</li></ul></div>
    <div class="panel"><h2>Скільки коштує</h2><div class="tw"><table>
      <tr><th>Що робиш</th><th>Ціна</th></tr>
      <tr><td>Покращуєш карту до версії з тією ж назвою (Иссушение 0 → Иссушение 3)</td><td>різниця рівнів: 3</td></tr>
      <tr><td>Додаєш нову карту рівня 1–5</td><td>її рівень</td></tr>
      <tr><td>Додаєш нову карту рівня 0</td><td>1 XP</td></tr>
      <tr><td>Карти, які кампанія сама дає (сюжетні, слабкості)</td><td>безкоштовно</td></tr></table></div>
      <p class="note">Рівень — кількість крапок під ціною карти. Без крапок = рівень 0.</p></div>
    <div class="panel"><h2>Як вибирати покупки</h2><ul>
      <li><b>Спершу закрий слабке місце.</b> Боєць без пристойної зброї, шукач без способу втекти від ворога — перші покупки.</li>
      <li><b>Потім — ядро стилю.</b> Те, що сищик робить щоходу: зброя, книга, заклинання.</li>
      <li><b>Дешеві навички L1–2 — найвигідніші.</b> «Дедукція 2», «Пісня мертвих», «Один на один» коштують 1–2 XP і грають кожну гру.</li>
      <li><b>Дорогі «бомби» (4–5 XP)</b> купуй у другій половині кампанії, коли основа вже стоїть.</li>
      <li>У кожній колоді є готова черга покупок з порахованою ціною.</li></ul></div>
    <div class="panel"><h2>Соло і дві руки</h2><ul>
      <li><b>Одна рука</b> — гнучкий сищик, що і бʼє, і шукає: Роланд, Дженні, Агнес, Піт, Джим.</li>
      <li><b>Дві руки</b> — пара «боєць + шукач». У вкладці «Дві руки» перевір, чи вистачить карт на обох.</li>
      <li>Кожна колода бере <b>1 випадкову базову слабкість</b>. Сигнатурні карти сищика в 30 не входять.</li></ul></div>
  </div>
</template>

<template id="xptpl_en">
  <div class="guide" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>Where experience comes from</h2><ul>
      <li>After each scenario you earn XP: victory points from cards in the victory display plus whatever the resolution gives. Write it in the campaign log.</li>
      <li>Spend it only <b>between scenarios</b>. You can save up for an expensive card.</li>
      <li>Deck size never changes: to add a card, remove another.</li></ul></div>
    <div class="panel"><h2>What it costs</h2><div class="tw"><table>
      <tr><th>What you do</th><th>Cost</th></tr>
      <tr><td>Upgrade a card to a version with the same name (Shrivelling 0 → Shrivelling 3)</td><td>level difference: 3</td></tr>
      <tr><td>Add a new level 1–5 card</td><td>its level</td></tr>
      <tr><td>Add a new level 0 card</td><td>1 XP</td></tr>
      <tr><td>Cards the campaign gives you (story assets, weaknesses)</td><td>free</td></tr></table></div>
      <p class="note">A card's level is the number of pips under its cost. No pips = level 0.</p></div>
    <div class="panel"><h2>How to choose purchases</h2><ul>
      <li><b>Fix the weak spot first.</b> A fighter without a decent weapon, a seeker without a way to escape enemies — buy those first.</li>
      <li><b>Then the core of the style.</b> What the investigator does every turn: weapon, tome, spell.</li>
      <li><b>Cheap level 1–2 skills are the best value.</b> Deduction 2, Song of the Dead, Mano a Mano cost 1–2 XP and play every game.</li>
      <li><b>Expensive bombs (4–5 XP)</b> belong in the second half of the campaign, once the base is solid.</li>
      <li>Every deck has a ready upgrade queue with costs already counted.</li></ul></div>
    <div class="panel"><h2>Solo and two-handed</h2><ul>
      <li><b>One-handed</b> — take a flexible investigator who both fights and finds clues: Roland, Jenny, Agnes, Pete, Jim.</li>
      <li><b>Two-handed</b> — pair a fighter with a seeker. Use the Two-handed tab to check you have enough cards for both.</li>
      <li>Each deck also takes <b>1 random basic weakness</b>. An investigator's signature cards do not count toward the 30.</li></ul></div>
  </div>
</template>
