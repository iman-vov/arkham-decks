<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Аркхем">
<meta name="theme-color" content="#0d1311">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Колоди Аркхема</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: архівна картотека — плитки справ-сищиків; справа відкривається як окремий аркуш; карти як мініатюри з корінцем класу */
:root{
  /* Ніч в Аркемі: чорнильно-зелене тло, пергаментні аркуші справ, кольори класів як на картах */
  color-scheme:dark;
  --night:#0d1311; --night2:#16201c; --bg:#0d1311;
  --paper:#e6dcc3; --paper2:#d8ccad; --ink:#231d16; --muted:#6b5f4c; --line:#b9aa86;
  --glow:#9ec7a6; --brass:#b08d4a; --fg:#e4dcc8; --fgm:#a59c88;
  --accent:#2e5b44;
  --gua:#2b6cb0; --see:#c27318; --rog:#1f7a3c; --mys:#5b3cb0; --sur:#b12f38; --neu:#6f6a5e;
  --wil:#3f57a3; --int:#9c5c22; --com:#a1323a; --agi:#2a7445; --wild:#7d6a24;
  --chip:#d3c6a4; --scrim:rgba(4,8,6,.72); --onc:#ffffff;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% -10%, #1f3a2e 0%, transparent 60%), radial-gradient(90% 60% at 100% 110%, #1b2a3a 0%, transparent 55%), var(--night);background-attachment:fixed;color:var(--fg);min-height:100vh;font:16px/1.45 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);mix-blend-mode:screen}
.wrap{position:relative;z-index:1}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:400 clamp(2rem,6vw,2.8rem)/1 var(--f-display);margin:0;text-wrap:balance;color:var(--fg);letter-spacing:.02em;text-shadow:0 0 18px rgba(158,199,166,.25)}
h2{font:400 1.5rem/1.1 var(--f-display);margin:0;text-wrap:balance}
h3{font:800 .76rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--fgm);margin:0}
.panel h3,.sheet h3{color:var(--muted)}
.panel,.tile,.sheet,.pair{color:var(--ink)}
p{margin:0}
.lede{color:var(--fgm);max-width:62ch;margin-top:6px}
.note{font-size:.88rem;color:var(--fgm)}
.panel .note,.sheet .note,.tile .note{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top, 0px);background:var(--night);padding-block:10px;z-index:5;border-bottom:1px solid #2c3a33;scrollbar-width:none}
.tab{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.c-guardian{--c:var(--gua)} .c-seeker{--c:var(--see)} .c-rogue{--c:var(--rog)} .c-mystic{--c:var(--mys)} .c-survivor{--c:var(--sur)} .c-neutral{--c:var(--neu)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* investigator tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%),var(--paper);border:0;border-radius:6px;padding:0;text-align:left;display:grid;grid-template-columns:92px 1fr;min-width:0;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.45);color:var(--ink)}
.tile .tx{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:4px solid var(--c)}
.portrait{background:var(--c) center/cover no-repeat;position:relative;min-height:128px;box-shadow:inset -6px 0 10px rgba(0,0,0,.25)}
.portrait.has{background-size:auto 165%;background-position:5% 22%}
.portrait .ini{position:absolute;inset:0;display:grid;place-items:center;font:400 2.2rem var(--f-display);color:rgba(255,255,255,.85)}
.portrait.has .ini{display:none}
.tile:hover{transform:translateY(-1px)}
.tile{transition:transform .15s}
.tile .nm{font:400 1.25rem/1.1 var(--f-display)}
.tile .en{font-size:.82rem;color:var(--muted)}
.tile .ti{font-size:.92rem}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;margin-top:auto}
.tag{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.prog{height:4px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.stars{font-family:var(--f-mono);letter-spacing:1px}

/* deck view */
.deckhead{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.deckhead .portrait{min-height:110px;border-radius:50%;box-shadow:0 0 0 3px var(--c),0 0 0 6px rgba(176,141,74,.5),0 10px 30px rgba(0,0,0,.6)}
.deckhead .portrait.has{background-size:auto 210%;background-position:6% 18%}
.deckhead h2{font-size:clamp(1.6rem,5vw,2.2rem);color:var(--fg)}
.deckhead .note{color:var(--fgm)}
.deckhead .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.back{align-self:flex-start;border:1px solid #3a4a41;background:var(--night2);color:var(--fg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.st{font-family:var(--f-mono);font-size:.82rem;border:1px solid #3a4a41;border-radius:4px;padding:3px 8px;background:var(--night2);color:var(--fg)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%),var(--paper);box-shadow:0 6px 22px rgba(0,0,0,.45);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:88px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--c);border-radius:2px 2px 0 0;min-height:2px}
.bar b{font:600 .72rem var(--f-mono);color:var(--ink)}
.bar span{font:500 .72rem var(--f-mono);color:var(--muted)}
.iconsum{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.88rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.reset{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 9px;font-size:.82rem}
.ghead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;margin-top:8px;padding-bottom:3px;border-bottom:2px solid var(--c);color:var(--c)}
.ghead .cnt{margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-weight:500}
.ghead .ru{font-weight:500;color:var(--muted)}
.sublabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 2px}
.row{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;border-bottom:1px dashed var(--line)}
.row input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.rowbtn{border:0;background:transparent;text-align:left;padding:6px 2px;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;min-width:0}
.rowbtn .n{font-family:var(--f-mono)}
.rowbtn .t{min-width:0}
.rowbtn .t b{font-weight:700;display:block}
.rowbtn .t i{font-style:normal;color:var(--muted);font-size:.84rem}
.right{display:flex;gap:6px;align-items:center}
.row:has(input:checked) .t{opacity:.42;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.scan{position:relative;border:0;padding:0;background:transparent;border-radius:9px;overflow:hidden;aspect-ratio:63/88;max-width:100%;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan .qty{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font:600 .8rem var(--f-mono);border-radius:4px;padding:1px 7px}
.scan.got{opacity:.4}
.scan.land{aspect-ratio:88/63}
.bigscan{width:100%;border-radius:12px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.6)}

/* mini card */
.mc{position:relative;border:0;padding:0;background:var(--paper);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);min-width:0}
.mc .band{background:var(--c);color:var(--onc);padding:8px 8px 10px 44px;min-height:54px;position:relative;display:flex;flex-direction:column;justify-content:center}
.mc .band b{font-weight:800;font-size:.95rem;line-height:1.1;color:#fff}
.mc .band i{font-style:normal;font-size:.74rem;opacity:.85;color:#fff}
.mc .costb{position:absolute;left:7px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:600 .95rem var(--f-mono);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.mc .lvl{position:absolute;left:7px;top:41px;width:30px;text-align:center;font-size:.6rem;letter-spacing:1px;color:#fff}
.mc .bodyc{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.mc .type{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mc .tr{font-size:.8rem;font-style:italic;color:var(--muted)}
.mc .qty{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.35);color:#fff;font:600 .78rem var(--f-mono);border-radius:4px;padding:1px 6px}
.mc.got{opacity:.45}
.mc.big .band{min-height:80px;padding-left:58px}
.mc.big .band b{font-size:1.25rem}
.mc.big .costb{width:40px;height:40px;font-size:1.15rem;top:12px}
.mc.big .lvl{top:56px;width:40px;font-size:.75rem}
.icons{display:flex;gap:3px;flex-wrap:wrap}
.ic{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:4px;color:#fff;font:700 .72rem var(--f-body)}
.ic.w{background:var(--wil)} .ic.i{background:var(--int)} .ic.c{background:var(--com)} .ic.a{background:var(--agi)} .ic.x{background:var(--wild)}
.icn{font:600 .8rem var(--f-mono);display:inline-flex;gap:4px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%),var(--paper);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet .close{align-self:flex-end;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:8px 14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.84rem;display:inline-flex;gap:6px;align-items:center}

ol.ups{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.ups li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.xp{font-family:var(--f-mono);background:var(--chip);border-radius:4px;text-align:center;padding:2px 0;font-size:.85rem}
.swap{min-width:0;font-size:.93rem}
.swap button{border:0;background:transparent;padding:0;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.swap .why{color:var(--accent);font-size:.85rem;display:block}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid #3a4a41;border-radius:6px;background:var(--night2);color:var(--fg)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);flex:1 1 200px;min-width:0}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.ok{color:var(--rog);font-weight:700}.bad{color:var(--sur);font-weight:700}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pair{border:0;border-radius:6px;padding:10px;background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.4);text-align:left;display:flex;flex-direction:column;gap:4px}
.pair b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.pair span{font-size:.86rem;color:var(--muted)}
.pair .faces{display:flex;gap:6px}
.pair .faces .portrait{width:48px;min-height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.pair .faces .portrait.has{background-size:auto 220%;background-position:6% 18%}
.pair .faces .portrait .ini{font-size:1.2rem}
.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.guide li{max-width:65ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* v4 additions */
.tilew{position:relative;min-width:0;display:flex}
.tilew .tile{flex:1}
.star{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--muted);font-size:1.1rem;line-height:1;display:grid;place-items:center;z-index:2}
.star[aria-pressed="true"]{background:var(--brass);color:#fff;border-color:var(--brass)}
.deckhead .star{position:static;background:var(--night2);border-color:#3a4a41;color:var(--fgm)}
.deckhead .star[aria-pressed="true"]{background:var(--brass);color:#fff}
.scanw{position:relative;min-width:0}
.scanw .scan,.scanw .mc{width:100%}
.tick{position:absolute;left:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:transparent;font-weight:800;font-size:1rem;display:grid;place-items:center;z-index:2}
.tick[aria-pressed="true"]{background:var(--rog);color:#fff}
.subbadge{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--brass);color:#fff;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle}
.scanw .subbadge{position:absolute;left:6px;top:6px;margin:0;z-index:2}
.banner{background:var(--night2);border:1px solid #3a4a41;border-radius:6px;padding:10px 12px;color:var(--fg);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.banner button,.linkbtn{border:1px solid #3a4a41;background:transparent;color:var(--glow);border-radius:4px;padding:3px 10px;font-size:.86rem}
.subs{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.subs .from{color:var(--muted);text-decoration:line-through}
.cyclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cyc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:rgba(255,255,255,.25)}
.cyc input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.cyc small{display:block;color:var(--muted);font-size:.8rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;font-weight:700;font-size:.9rem}
.pbtn.primary{background:var(--ink);color:var(--paper)}
.pbtn.danger{border-color:var(--sur);color:var(--sur)}
.pbtn.danger.armed{background:var(--sur);color:#fff}
textarea,.tin{width:100%;font:inherit;font-size:.9rem;padding:8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.45);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.camp{border:0;border-radius:6px;padding:12px;background:var(--paper);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.camp b{font:400 1.2rem var(--f-display)}
.camp .faces{display:flex;gap:4px}
.camp .faces .portrait{width:40px;min-height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.camp .faces .portrait.has{background-size:auto 220%;background-position:6% 18%}
.camp .faces .portrait .ini{font-size:1rem}
.invrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;border-top:1px dashed var(--line);padding-top:12px}
.invrow .portrait{min-height:64px;border-radius:50%;box-shadow:0 0 0 2px var(--c)}
.invrow .portrait.has{background-size:auto 220%;background-position:6% 18%}
.ctr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctr button{border:0;background:rgba(0,0,0,.06);width:34px;height:32px;font-weight:800;font-size:1.05rem}
.ctr span{min-width:44px;text-align:center;font:600 .95rem var(--f-mono)}
.ctrs{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.ctrs label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.uplist{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.uplist label{display:grid;grid-template-columns:22px 48px 1fr;gap:6px;align-items:center}
.uplist input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.xpsum{font:600 .95rem var(--f-mono)}
.xpsum .left{color:var(--rog)}
</style>
</head>
<body>

/* ---------- rules: legality & adaptation ---------- */
function legalIdx(inv, c, sel){
  const opts = OPTS[inv] || []; const f=[c.f,c.f2].filter(Boolean); const tr=c.te||[];
  for(let i=0;i<opts.length;i++){ const o=opts[i];
    if(o.not){ if(o.trait && o.trait.some(t=>tr.includes(t))) return -1; continue; }
    if(o.deck_size_select && !o.faction) continue;
    if(o.level && !(o.level.min<=c.xp && c.xp<=o.level.max)) continue;
    let ok = true;
    if(o.faction) ok = ok && f.some(x=>o.faction.includes(x));
    if(o.faction_select) ok = ok && f.includes(sel);
    if(o.trait) ok = ok && o.trait.some(t=>tr.includes(t));
    if(o.type) ok = ok && o.type.includes(c.t);
    if(o.uses) ok = ok && !!c.ch;
    if(o.text) ok = false;
    if(o.tag && !(o.faction||o.trait||o.uses||o.text)) ok = false;
    if(o.option_select) ok = false;
    if(ok) return i;
  }
  return -1;
}
const invAvailable = (d,pool) => pool.includes(C[d.inv].cyc);
const cache = new Map();
function adapt(d, pool){
  const key = d.id+'|'+pool.join(',');
  if(cache.has(key)) return cache.get(key);
  const avail = k => pool.includes(C[k].cyc);
  const cnt = {}, byName = {}, lim = {};
  const add = (k,n) => { cnt[k]=(cnt[k]||0)+n; byName[C[k].en]=(byName[C[k].en]||0)+n; const i=legalIdx(d.inv,C[k],SEL[d.id]); if(i>=0 && OPTS[d.inv][i].limit) lim[i]=(lim[i]||0)+n; };
  const miss = [];
  d.list.forEach(([n,k]) => avail(k) ? add(k,n) : miss.push([n,k]));
  const subs = [];
  for(const [n,k] of miss){
    for(let x=0;x<n;x++){
      const o = C[k]; let best=null, bs=-1e9;
      for(const p of POOL){
        const c = C[p]; if(!avail(p)) continue;
        const max = Math.min(c.q, c.dl||2);
        if((cnt[p]||0) >= max || (byName[c.en]||0) >= (c.dl||2)) continue;
        const i = legalIdx(d.inv, c, SEL[d.id]); if(i<0) continue;
        const ol = OPTS[d.inv][i]; if(ol.limit && (lim[i]||0) >= ol.limit) continue;
        let sc = (c.t===o.t?6:0) + (c.f===o.f?3:0) + (c.slot&&c.slot===o.slot?2:0);
        sc += (c.te||[]).filter(t=>(o.te||[]).includes(t)).length*2;
        sc += c.ic.reduce((a,v,j)=>a+Math.min(v,o.ic[j]),0);
        const ofn=o.fn||'', cfn=c.fn||''; let shared=0; for(const ch of ofn) if(cfn.includes(ch)) shared++;
        sc += shared*4; if(ofn && !shared) sc -= 4;
        sc -= Math.abs((c.cost??0)-(o.cost??0))*0.6;
        if(cnt[p]) sc += 1.5;
        if(c.f==='neutral' && o.f!=='neutral') sc -= 1;
        if(WEAK.has(c.en) && c.en!==o.en) sc -= 7;
        if(sc>bs){ bs=sc; best=p; }
      }
      if(best){ add(best,1); subs.push({from:k,to:best}); } else subs.push({from:k,to:null});
    }
  }
  const list = miss.length ? Object.entries(cnt).map(([k,n])=>[n,k]) : d.list;
  const subTo = new Set(subs.map(s=>s.to).filter(Boolean));
  const inList = new Set(list.map(([n,k])=>k));
  const ups = d.ups.filter(u => avail(u.inn) && (!u.out || avail(u.out)));
  const r = {list, subs, subTo, ups, inList};
  cache.set(key, r); return r;
}

function scan(k, n, cls=''){
  if(failed.has(k)) return mini(k,n,cls);
  const land = C[k].t==='investigator' ? ' land' : '';
  return `<button class="scan ${cls}${land}" data-card="${k}" data-n="${n||0}" data-cls="${cls}"><img src="${IMGS(k)[0]}" data-i="0" data-k="${k}" alt="${esc(C[k].ru)}" loading="lazy">${n?`<span class="qty">${n}×</span>`:''}</button>`;
}
document.addEventListener('error', e=>{
  const im=e.target; if(!(im instanceof HTMLImageElement) || !im.dataset.k) return;
  const k=im.dataset.k, urls=IMGS(k), i=+im.dataset.i+1;
  if(i<urls.length){ im.dataset.i=i; im.src=urls[i]; return; }
  failed.add(k);
  const b=im.closest('.scan'); const t=document.createElement('div');
  if(b){ t.innerHTML=mini(k,+b.dataset.n,b.dataset.cls); b.replaceWith(t.firstElementChild); }
  else { t.innerHTML=mini(k,0,'big'); im.replaceWith(t.firstElementChild); }
}, true);

  const g=gotCount(d,a.list), t=total(a.list);
  const ctxBanner = S.ctx ? `<div class="banner"><span>Колода в кампанії «${esc(S.ctx.name)}» · набір: ${esc(poolLabel(pool))}</span><button data-backcamp="1">До кампанії</button></div>` : '';

}
function vCamp(c){
  if(!c){ S.camp=null; return vCamps(); }
  const rows = c.inv.map((iv,ix)=>{
    const d=deckById(iv.deck), inv=C[d.inv], a=adapt(d,c.pool), spent=upXP(d,c.pool,iv.bought), left=iv.xp-spent;
    const ups = a.ups.map((u,i)=>`<label for="up_${c.id}_${ix}_${i}"><input type="checkbox" id="up_${c.id}_${ix}_${i}" data-buy="${ix}:${i}" ${iv.bought.includes(i)?'checked':''}><span class="xp">${u.xp} XP</span><span>${u.out?`<span class="note" style="display:inline">${esc(C[u.out].ru)} → </span>`:''}<b>${esc(C[u.inn].ru)} ${pips(C[u.inn].xp)}</b></span></label>`).join('');
    const ctr = (f,lbl,v) => `<label>${lbl}<span class="ctr"><button data-ctr="${ix}:${f}:-1" aria-label="Мінус">−</button><span>${v}</span><button data-ctr="${ix}:${f}:1" aria-label="Плюс">+</button></span></label>`;
    return `<div class="invrow c-${inv.f}">${portrait(d.inv)}<div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div><b style="font:400 1.2rem var(--f-display)">${esc(inv.ru)}</b> <span class="note" style="display:inline">${esc(d.title)}</span></div>
      <div class="ctrs">${ctr('xp','Досвід отримано',iv.xp)}${ctr('pt','Фіз. травма',iv.pt)}${ctr('mt','Псих. травма',iv.mt)}</div>
      <p class="xpsum">Витрачено ${spent} · <span class="${left<0?'bad':'left'}">залишок ${left}</span></p>
      <div class="btnrow"><button class="pbtn" data-campdeck="${d.id}">Відкрити колоду</button><button class="pbtn danger ${S.armed==='rm'+ix?'armed':''}" data-rminv="${ix}">${S.armed==='rm'+ix?'Точно прибрати?':'Прибрати з кампанії'}</button></div>
      <details><summary class="note" style="cursor:pointer">Покупки за досвід (відмічай куплене)</summary><div class="uplist" style="margin-top:8px">${ups||'<span class="note">Немає покращень з цих коробок.</span>'}</div></details>
    </div></div>`;
  }).join('');
  const addable = decksIn(c.pool).filter(d=>!c.inv.some(i=>i.deck===d.id));
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <button class="back" data-closecamp="1">← Усі кампанії</button>
    <div class="panel"><h2>${esc(c.name)}</h2><p class="note">${esc((CAMPAIGNS.find(x=>x[0]===c.cycle)||['',''])[1])} · набір: ${esc(poolLabel(c.pool))}</p>
      ${rows}
      ${c.inv.length<4 && addable.length?`<div class="sel"><select id="addinv" aria-label="Додати сищика">${addable.map(d=>`<option value="${d.id}">${esc(C[d.inv].ru)} — ${esc(d.title)}</option>`).join('')}</select><button class="pbtn" data-addinv="1">Додати сищика</button></div>`:''}
    </div>
    <div class="panel"><h3>Нотатки кампанії (рішення, журнал)</h3><textarea id="campnotes" aria-label="Нотатки">${esc(c.notes||'')}</textarea></div>
    <div class="btnrow"><button class="pbtn danger ${S.armed==='del'?'armed':''}" data-delcamp="1" style="border-color:var(--sur);color:${S.armed==='del'?'#fff':'var(--sur)'}">${S.armed==='del'?'Точно видалити кампанію?':'Видалити кампанію'}</button></div>
  </div>`;
}

function vXP(){ return document.getElementById('xptpl').innerHTML; }

function render(){
  document.querySelectorAll('.tab[data-tab]').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===S.tab));
  if(S.tab==='decks') view.innerHTML = S.deck ? vDeck(S.deck) : vDecks();
  else if(S.tab==='camps') view.innerHTML = S.deck ? vDeck(S.deck) : vCamps();
  else if(S.tab==='cards') view.innerHTML = vCards();
  else if(S.tab==='pairs'){ view.innerHTML = vPairs(); const pa=document.getElementById('pa'), pb=document.getElementById('pb'); if(pa&&pa.options.length){ pa.value=S.pa&&[...pa.options].some(o=>o.value===S.pa)?S.pa:pa.options[0].value; pb.value=S.pb&&[...pb.options].some(o=>o.value===S.pb)?S.pb:(pb.options[1]||pb.options[0]).value; checkPair(); } }
  else if(S.tab==='coll') view.innerHTML = vColl();
  else view.innerHTML = vXP();
  hydrate(view);
}
function go(id, ctx=null){ S.deck=id; S.ctx=ctx; if(!ctx) S.tab='decks'; render(); window.scrollTo({top:0}); }

document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(!t) return; S.tab=t.dataset.tab; S.deck=null; S.ctx=null; S.armed=null; render();});
view.addEventListener('click',e=>{
  const el=e.target.closest('[data-card],[data-go],[data-back],[data-filter],[data-mode],[data-reset],[data-cf],[data-pa],[data-fav],[data-tick],[data-tabgo],[data-poolset],[data-export],[data-import],[data-newcamp],[data-cancelcamp],[data-ncinv],[data-createcamp],[data-opencamp],[data-closecamp],[data-campdeck],[data-backcamp],[data-ctr],[data-rminv],[data-addinv],[data-delcamp]');
  if(!el) return; const ds=el.dataset;
  if(ds.fav){ S.favs = isFav(ds.fav) ? S.favs.filter(x=>x!==ds.fav) : S.favs.concat(ds.fav); store.set('favs',S.favs); el.setAttribute('aria-pressed',isFav(ds.fav)); if(S.filter==='fav'&&!S.deck) render(); return; }
  if(ds.tick){ toggleCheck(S.deck, ds.tick); const on=!!checks(S.deck)[ds.tick]; el.setAttribute('aria-pressed',on); const sc=el.parentElement.querySelector('.scan,.mc'); if(sc) sc.classList.toggle('got',on); updCount(); return; }
  if(ds.card) return openCard(ds.card);
  if(ds.go) return go(ds.go);
  if(ds.back){ if(S.ctx){ S.deck=null; S.ctx=null; S.tab='camps'; } else S.deck=null; render(); return; }
  if(ds.backcamp){ S.deck=null; S.ctx=null; S.tab='camps'; render(); return; }
  if(ds.filter){ S.filter=ds.filter; store.set('filter',S.filter); render(); return; }
  if(ds.mode){ S.mode=ds.mode; store.set('mode',S.mode); render(); return; }
  if(ds.reset){ store.set('chk_'+S.deck,{}); render(); return; }
  if(ds.cf){ S.cf=ds.cf; render(); return; }
  if(ds.pa){ S.pa=ds.pa; S.pb=ds.pb; render(); return; }
  if(ds.tabgo){ S.tab=ds.tabgo; S.deck=null; render(); return; }
  if(ds.poolset){ S.pool = ds.poolset==='all'?ALLCYC.slice(): ds.poolset==='core'?['core']:['core','dwl','ptc','tfa','tcu','tde']; store.set('pool',S.pool); render(); return; }
  if(ds.export){ const code=exportState(); const box=document.getElementById('iobox'); box.value=code; const msg=document.getElementById('iomsg');
    const done=()=>msg.textContent='Код скопійовано. Встав його на іншому пристрої в це ж поле й натисни «Імпортувати».';
    try{ navigator.clipboard.writeText(code).then(done,()=>{box.select(); msg.textContent='Скопіюй код з поля вручну.';}); }catch(err){ box.select(); msg.textContent='Скопіюй код з поля вручну.'; } return; }
  if(ds.import){ const msg=document.getElementById('iomsg'); try{ const n=importState(document.getElementById('iobox').value); render(); document.getElementById('iomsg').textContent=`Імпортовано (${n} записів).`; }catch(err){ msg.textContent='Код не розпізнано. Скопіюй його повністю і спробуй ще раз.'; } return; }
  if(ds.newcamp){ S.newCamp=true; S.nc=null; render(); return; }
  if(ds.cancelcamp){ S.newCamp=false; render(); return; }
  if(ds.ncinv){ const nc=S.nc; nc.name=document.getElementById('nc_name').value; nc.inv = nc.inv.includes(ds.ncinv) ? nc.inv.filter(x=>x!==ds.ncinv) : (nc.inv.length<4 ? nc.inv.concat(ds.ncinv) : nc.inv); render(); return; }
  if(ds.createcamp){ const nc=S.nc; nc.name=document.getElementById('nc_name').value.trim() || (CAMPAIGNS.find(x=>x[0]===nc.cycle)||['','Кампанія'])[1];
    const c={id:uid(), name:nc.name, cycle:nc.cycle, pool:nc.pool.slice(), inv:nc.inv.map(id=>({deck:id,xp:0,pt:0,mt:0,bought:[]})), notes:''};
    S.camps.push(c); saveCamps(); S.newCamp=false; S.camp=c.id; render(); return; }
  if(ds.opencamp){ S.camp=ds.opencamp; S.armed=null; render(); return; }
  if(ds.closecamp){ S.camp=null; S.armed=null; render(); return; }
  if(ds.campdeck){ const c=campById(S.camp); go(ds.campdeck, {name:c.name, pool:c.pool}); return; }
  if(ds.ctr){ const [ix,f,dv]=ds.ctr.split(':'); const c=campById(S.camp), iv=c.inv[+ix]; iv[f]=Math.max(0,(iv[f]||0)+ +dv); saveCamps(); render(); return; }
  if(ds.rminv){ if(S.armed!=='rm'+ds.rminv){ S.armed='rm'+ds.rminv; render(); return; } const c=campById(S.camp); c.inv.splice(+ds.rminv,1); S.armed=null; saveCamps(); render(); return; }
  if(ds.addinv){ const c=campById(S.camp); const id=document.getElementById('addinv').value; c.inv.push({deck:id,xp:0,pt:0,mt:0,bought:[]}); saveCamps(); render(); return; }
  if(ds.delcamp){ if(S.armed!=='del'){ S.armed='del'; render(); return; } S.camps=S.camps.filter(c=>c.id!==S.camp); S.camp=null; S.armed=null; saveCamps(); render(); return; }
});
function updCount(){ const h=document.getElementById('deckcount'); if(!h) return; const d=deckById(S.deck), l=adapt(d,activePool()).list; h.textContent=`Колода · ${total(l)} карт · зібрано ${gotCount(d,l)}`; }
view.addEventListener('change',e=>{
  const t=e.target, ds=t.dataset;
  if(ds.ck){ toggleCheck(S.deck, ds.ck); updCount(); return; }
  if(t.id==='pa'||t.id==='pb'){ S.pa=document.getElementById('pa').value; S.pb=document.getElementById('pb').value; checkPair(); return; }
  if(ds.pool){ S.pool = t.checked ? ALLCYC.filter(k=>S.pool.includes(k)||k===ds.pool) : S.pool.filter(k=>k!==ds.pool); store.set('pool',S.pool); render(); return; }
  if(ds.nc){ const nc=S.nc; nc.name=document.getElementById('nc_name').value; nc.pool = t.checked ? ALLCYC.filter(k=>nc.pool.includes(k)||k===ds.nc) : nc.pool.filter(k=>k!==ds.nc); nc.inv = nc.inv.filter(id=>invAvailable(deckById(id),nc.pool)); render(); return; }
  if(t.id==='nc_cycle'){ S.nc.cycle=t.value; S.nc.name=document.getElementById('nc_name').value; return; }
  if(ds.buy){ const [ix,i]=ds.buy.split(':').map(Number); const c=campById(S.camp), iv=c.inv[ix]; iv.bought = t.checked ? iv.bought.concat(i) : iv.bought.filter(x=>x!==i); saveCamps(); render(); const det=view.querySelectorAll('.invrow details')[ix]; if(det) det.open=true; return; }
});
view.addEventListener('input',e=>{
  if(e.target.id==='campnotes'){ const c=campById(S.camp); c.notes=e.target.value; saveCamps(); return; }
  if(e.target.id!=='q') return;
  S.q=e.target.value;
  const tmp=document.createElement('div'); tmp.innerHTML=vCards();
  document.getElementById('cardgrid').replaceWith(tmp.querySelector('#cardgrid'));
  document.getElementById('cardcount').textContent=tmp.querySelector('#cardcount').textContent;
});
render();

</script>

<template id="xptpl">
  <div class="guide" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>Звідки досвід і коли його витрачати</h2><ul>
      <li>Після кожного сценарію рахуєш досвід: очки перемоги з карт у «переможній зоні» плюс те, що дає розвʼязка сценарію. Записуй у журнал кампанії.</li>
      <li>Витрачаєш його тільки <b>між сценаріями</b>. Можна копити на дорогу карту.</li>
      <li>Розмір колоди не змінюється: щоб додати карту, прибери іншу.</li></ul></div>
    <div class="panel"><h2>Скільки коштує</h2><div class="tw"><table>
      <tr><th>Що робиш</th><th>Ціна</th></tr>
      <tr><td>Покращуєш карту до версії з тією ж назвою (Иссушение 0 → Иссушение 3)</td><td>різниця рівнів: 3</td></tr>
      <tr><td>Додаєш нову карту рівня 1–5</td><td>її рівень</td></tr>
      <tr><td>Додаєш нову карту рівня 0</td><td>1 XP</td></tr>
      <tr><td>Карти, які кампанія сама дає (сюжетні, слабкості)</td><td>безкоштовно</td></tr></table></div>
      <p class="note">Рівень — кількість крапок під ціною карти. Без крапок = рівень 0.</p></div>
    <div class="panel"><h2>Як вибирати покупки</h2><ul>
      <li><b>Спершу закрий слабке місце.</b> Боєць без пристойної зброї, шукач без способу втекти від ворога — перші покупки.</li>
      <li><b>Потім — ядро стилю.</b> Те, що сищик робить щоходу: зброя, книга, заклинання.</li>
      <li><b>Дешеві навички L1–2 — найвигідніші.</b> «Дедукція 2», «Пісня мертвих», «Один на один» коштують 1–2 XP і грають кожну гру.</li>
      <li><b>Дорогі «бомби» (4–5 XP)</b> купуй у другій половині кампанії, коли основа вже стоїть.</li>
      <li>У кожній колоді є готова черга покупок з порахованою ціною.</li></ul></div>
    <div class="panel"><h2>Соло і дві руки</h2><ul>
      <li><b>Одна рука</b> — гнучкий сищик, що і бʼє, і шукає: Роланд, Дженні, Агнес, Піт, Джим.</li>
      <li><b>Дві руки</b> — пара «боєць + шукач». У вкладці «Дві руки» перевір, чи вистачить карт на обох.</li>
      <li>Кожна колода бере <b>1 випадкову базову слабкість</b>. Сигнатурні карти сищика в 30 не входять.</li></ul></div>
  </div>
</template>

</body>
</html>
